<style>
  :root {
    --bg: #f4f1ea;
    --panel: rgba(255, 255, 255, 0.82);
    --panel-strong: #ffffff;
    --ink: #162127;
    --muted: #61727c;
    --line: rgba(22, 33, 39, 0.09);
    --accent: #2f6b66;
    --accent-strong: #1f4f4b;
    --warn: #b46016;
    --danger: #b33f3f;
    --blue: #2d5fb6;
    --shadow: 0 18px 40px rgba(22, 33, 39, 0.08);
    --radius-xl: 24px;
    --radius-lg: 18px;
    --radius-md: 14px;
    --font-body: "Segoe UI", "Helvetica Neue", sans-serif;
    --font-display: Georgia, "Times New Roman", serif;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; background:
      radial-gradient(circle at top left, rgba(47, 107, 102, 0.14), transparent 32%),
      radial-gradient(circle at right, rgba(45, 95, 182, 0.10), transparent 28%),
      linear-gradient(180deg, #f8f5ef 0%, #f1ede5 100%);
    color: var(--ink);
    font-family: var(--font-body);
  }

  body { padding: 18px; }
  .hidden { display: none !important; }
  .small { font-size: 12px; }
  .muted { color: var(--muted); }
  .eyebrow { margin: 0 0 6px; text-transform: uppercase; letter-spacing: 0.12em; font-size: 11px; color: var(--muted); }

  .app-shell {
    display: grid;
    grid-template-columns: 280px minmax(0, 1fr);
    min-height: calc(100vh - 36px);
    gap: 18px;
  }

  .sidebar, .topbar, .card, .panel, .list-row, .message-banner {
    backdrop-filter: blur(18px);
    background: var(--panel);
    border: 1px solid var(--line);
    box-shadow: var(--shadow);
  }

  .sidebar {
    border-radius: var(--radius-xl);
    padding: 24px;
    display: flex;
    flex-direction: column;
    gap: 24px;
  }

  .brand-block { display: flex; gap: 14px; align-items: center; }
  .brand-block h1, .topbar h2, .section-title { margin: 0; font-family: var(--font-display); font-weight: 600; }
  .brand-mark {
    width: 54px;
    height: 54px;
    border-radius: 18px;
    display: grid;
    place-items: center;
    background: linear-gradient(135deg, var(--accent), var(--blue));
    color: white;
    font-weight: 700;
    letter-spacing: 0.08em;
  }

  .nav { display: grid; gap: 8px; }
  .nav-button {
    width: 100%;
    text-align: left;
    border: 0;
    border-radius: 16px;
    padding: 14px 16px;
    background: transparent;
    color: var(--ink);
    font-size: 14px;
    cursor: pointer;
    transition: 160ms ease;
  }
  .nav-button.active, .nav-button:hover { background: rgba(47, 107, 102, 0.10); color: var(--accent-strong); }
  .sidebar-foot { margin-top: auto; }

  .main-shell { min-width: 0; display: grid; gap: 18px; }
  .topbar {
    border-radius: var(--radius-xl);
    padding: 20px 24px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 16px;
  }
  .topbar-actions { display: flex; align-items: center; gap: 12px; }
  .status-pill, .user-pill, .badge, .chip {
    border-radius: 999px;
    padding: 8px 12px;
    background: rgba(47, 107, 102, 0.08);
    color: var(--accent-strong);
    font-size: 12px;
    border: 1px solid rgba(47, 107, 102, 0.14);
  }
  .message-banner {
    border-radius: 16px;
    padding: 14px 16px;
  }

  .page { display: grid; gap: 18px; }
  .grid-cards { display: grid; gap: 18px; grid-template-columns: repeat(4, minmax(0, 1fr)); }
  .card, .panel {
    border-radius: var(--radius-xl);
    padding: 20px;
  }
  .card-number { font-size: 34px; font-family: var(--font-display); margin: 4px 0; }
  .stack { display: grid; gap: 12px; }
  .two-col { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(320px, 0.85fr); gap: 18px; }
  .profile-grid { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(320px, 0.8fr); gap: 18px; }
  .panel-header, .split-header { display: flex; justify-content: space-between; gap: 16px; align-items: center; margin-bottom: 14px; }
  .section-title { font-size: 24px; }

  .toolbar {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    align-items: center;
  }
  .toolbar input, .toolbar select, .toolbar textarea, .form-grid input, .form-grid select, .form-grid textarea {
    width: 100%;
    border: 1px solid var(--line);
    background: rgba(255,255,255,0.88);
    border-radius: 14px;
    padding: 12px 14px;
    color: var(--ink);
    font: inherit;
  }
  .toolbar input.filter-input { min-width: 280px; flex: 1 1 320px; }
  .toolbar input.search-input { min-width: 220px; flex: 1 1 220px; }

  .button {
    border: 0;
    border-radius: 14px;
    padding: 12px 14px;
    background: var(--accent);
    color: #fff;
    font: inherit;
    cursor: pointer;
  }
  .button.secondary { background: rgba(22, 33, 39, 0.07); color: var(--ink); }

  .chip-row, .badge-row { display: flex; flex-wrap: wrap; gap: 8px; }
  .badge.warn { background: rgba(180, 96, 22, 0.12); color: var(--warn); border-color: rgba(180, 96, 22, 0.2); }
  .badge.danger { background: rgba(179, 63, 63, 0.12); color: var(--danger); border-color: rgba(179, 63, 63, 0.2); }
  .badge.blue { background: rgba(45, 95, 182, 0.10); color: var(--blue); border-color: rgba(45, 95, 182, 0.16); }

  .list {
    display: grid;
    gap: 10px;
  }
  .list-row {
    border-radius: 18px;
    padding: 16px;
    display: grid;
    gap: 10px;
    cursor: pointer;
  }
  .list-row header {
    display: flex;
    justify-content: space-between;
    gap: 16px;
    align-items: start;
  }
  .list-row h4, .list-row p { margin: 0; }
  .meta-row {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    color: var(--muted);
    font-size: 13px;
  }

  .profile-card {
    border-radius: var(--radius-xl);
    padding: 24px;
    background: linear-gradient(135deg, rgba(47, 107, 102, 0.12), rgba(255,255,255,0.72));
    border: 1px solid rgba(47, 107, 102, 0.12);
  }
  .profile-card h3 { margin: 0 0 6px; font-size: 32px; font-family: var(--font-display); }

  .timeline {
    display: grid;
    gap: 12px;
  }
  .timeline-item {
    border-left: 3px solid rgba(47, 107, 102, 0.24);
    padding: 12px 0 12px 14px;
  }
  .timeline-item h4, .timeline-item p { margin: 0; }

  .form-grid {
    display: grid;
    gap: 12px;
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
  .form-grid .span-2 { grid-column: 1 / -1; }

  table.data-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 14px;
  }
  .data-table th, .data-table td {
    text-align: left;
    padding: 12px 10px;
    border-bottom: 1px solid var(--line);
    vertical-align: top;
  }
  .data-table th { color: var(--muted); font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em; }

  @media (max-width: 1180px) {
    .grid-cards { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .profile-grid, .two-col, .app-shell { grid-template-columns: 1fr; }
    .sidebar { order: 2; }
  }

  @media (max-width: 720px) {
    body { padding: 10px; }
    .grid-cards, .form-grid { grid-template-columns: 1fr; }
    .topbar { padding: 18px; }
    .sidebar, .card, .panel { padding: 18px; }
  }
</style>
