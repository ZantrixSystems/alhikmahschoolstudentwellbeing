<script>
  const state = {
    bootstrap: null,
    route: {},
    activeProfileAction: '',
    profileData: null,
    profileSaving: false,
    pageCache: {},
  };

  const PAGE_CACHE_TTL = 60000;

  function getCached(key) {
    const entry = state.pageCache[key];
    if (!entry) return null;
    if (Date.now() - entry.ts > PAGE_CACHE_TTL) { delete state.pageCache[key]; return null; }
    return entry.data;
  }

  function setCached(key, data) {
    state.pageCache[key] = { ts: Date.now(), data };
  }

  function bustCache(key) {
    delete state.pageCache[key];
  }

  function setStatus(text) {
    const el = document.getElementById('globalStatus');
    if (el) el.textContent = text;
  }

  function showMessage(text, mode) {
    const el = document.getElementById('appMessage');
    if (!text) {
      el.classList.add('hidden');
      el.textContent = '';
      return;
    }
    el.classList.remove('hidden');
    el.textContent = text;
    el.style.borderColor = mode === 'error' ? 'rgba(179,63,63,0.28)' : 'var(--line)';
  }

  function callServer(request) {
    setStatus('Loading');
    return new Promise((resolve, reject) => {
      google.script.run
        .withSuccessHandler((result) => {
          setStatus('');
          resolve(result);
        })
        .withFailureHandler((error) => {
          setStatus('Error');
          showMessage('Something went wrong. Please try again or contact support.', 'error');
          reject(error);
        })
        .apiProxy(request);
    });
  }

  function parseRoute() {
    const url = new URL(window.location.href);
    state.route = {
      page: url.searchParams.get('page') || 'dashboard',
      studentId: url.searchParams.get('studentId') || '',
      q: url.searchParams.get('q') || '',
      filter: url.searchParams.get('filter') || '',
      filterMode: url.searchParams.get('filterMode') || (url.searchParams.get('filter') ? 'advanced' : 'builder'),
      view: url.searchParams.get('view') || 'calendar',
      settingsTab: url.searchParams.get('settingsTab') || 'users',
    };
  }

  function updateRoute(next) {
    const url = new URL(window.location.href);
    Object.keys(next).forEach((key) => {
      if (next[key]) url.searchParams.set(key, next[key]);
      else url.searchParams.delete(key);
    });
    window.history.pushState({}, '', url.toString());
    parseRoute();
    renderRoute();
  }

  function hasPermission(permission) {
    const keys = (state.bootstrap.currentUser && state.bootstrap.currentUser.permissionKeys) || [];
    return keys.includes('*') || keys.includes(permission);
  }

  function escapeHtml(value) {
    return String(value || '')
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  function formatDate(value, dateOnly) {
    if (!value || String(value).startsWith('1970-01-01')) return 'Not set';
    const options = dateOnly ? { dateStyle: 'medium' } : { dateStyle: 'medium', timeStyle: 'short' };
    return new Date(value).toLocaleString([], options);
  }

  function friendlyLabel(value) {
    return String(value || '')
      .replace(/[._-]+/g, ' ')
      .replace(/\b\w/g, (letter) => letter.toUpperCase());
  }

  function friendlyVisibility(value) {
    const labels = { none: 'Hidden', indicator: 'Limited', summary: 'Summary', full: 'Full' };
    return labels[value] || friendlyLabel(value);
  }

  function studentName(student) {
    return [student.preferred_name || student.first_name, student.last_name].filter(Boolean).join(' ');
  }

  function radarBadge(radar) {
    return `<span class="radar-badge radar-${escapeHtml(radar.teamKey || radar.team_key || 'general')}">${escapeHtml(radar.teamName || radar.team_name || 'Radar')}</span>`;
  }

  function renderFilterChips(expression) {
    if (!expression) return '<span class="muted small">No filters applied.</span>';
    return expression
      .split(/(?=[;,])/)
      .map((part) => part.replace(/^[;,]/, '').trim())
      .filter(Boolean)
      .map((part) => `<span class="chip">${escapeHtml(part)}</span>`)
      .join('');
  }

  function buildStudentFilterFromBuilder() {
    const parts = [];
    const year = document.getElementById('filterYear').value;
    const radar = document.getElementById('filterRadar').value;
    const status = document.getElementById('filterStatus').value;
    const lead = document.getElementById('filterLead').value;
    const latestAfter = document.getElementById('filterLatestAfter').value;
    const latestBefore = document.getElementById('filterLatestBefore').value;
    const openFollowUp = document.getElementById('filterOpenFollowUp').checked;
    if (year) parts.push('yearGroup==' + year);
    if (radar) parts.push('radar==' + radar);
    if (status) parts.push('status==' + status);
    if (lead) parts.push('lead~=' + lead.replace(/\s+/g, '_'));
    if (latestAfter) parts.push('latestActivity>=' + latestAfter);
    if (latestBefore) parts.push('latestActivity<=' + latestBefore);
    if (openFollowUp) parts.push('openFollowUp==true');
    return parts.join(';');
  }

  function renderNav() {
    const nav = document.getElementById('nav');
    nav.innerHTML = '';
    (state.bootstrap.navigation || []).forEach((item) => {
      const isActive = state.route.page === item.key || (item.key === 'students' && state.route.page === 'student-profile');
      const button = document.createElement('button');
      button.className = 'nav-button' + (isActive ? ' active' : '');
      button.textContent = item.label;
      button.onclick = () => updateRoute({ page: item.key, studentId: '', settingsTab: '', filter: '', q: '' });
      nav.appendChild(button);
    });
  }

  function setPageTitle(text) {
    document.getElementById('pageTitle').textContent = text;
  }

  function skeletonCards(count) {
    return Array.from({ length: count }, () => '<article class="skeleton-card"></article>').join('');
  }

  function skeletonRows(count) {
    return `<div class="skeleton-stack">${Array.from({ length: count }, () => '<div class="skeleton-row"></div>').join('')}</div>`;
  }

  function renderDashboard() {
    setPageTitle('Dashboard');
    const target = document.getElementById('dashboardPage');
    const showSafeguardingPanel = hasPermission('concerns.review');
    target.innerHTML = `
      <section class="grid-cards compact-metrics" id="headlineCards">${skeletonCards(4)}</section>
      <section class="two-col">
        <article class="panel">
          <div class="panel-header">
            <div>
              <p class="eyebrow">Radars</p>
              <h3 class="section-title">Team Load</h3>
            </div>
          </div>
          <div id="teamLoadList" class="list compact-list">${skeletonRows(4)}</div>
        </article>
        <article class="panel">
          <div class="panel-header">
            <div>
              <p class="eyebrow">Upcoming</p>
              <h3 class="section-title">My Follow-ups</h3>
            </div>
          </div>
          <div id="dashboardUpcoming" class="list compact-list">${skeletonRows(4)}</div>
        </article>
      </section>
      ${showSafeguardingPanel ? `
      <section class="panel compact-panel">
        <div class="panel-header">
          <div>
            <p class="eyebrow safeguarding-eyebrow">Safeguarding</p>
            <h3 class="section-title">Open Concerns</h3>
          </div>
        </div>
        <div id="dslConcernList" class="list compact-list">${skeletonRows(4)}</div>
      </section>` : ''}
    `;

    const cached = getCached('dashboard');
    const dataPromise = cached
      ? Promise.resolve(cached)
      : callServer({ path: '/api/dashboard', method: 'get' }).then((data) => { setCached('dashboard', data); return data; });

    dataPromise.then((data) => {
      const headline = data.headline || {};
      document.getElementById('headlineCards').innerHTML = [
        ['Students', headline.student_count || 0],
        ['Open Concerns', headline.open_concern_count || 0],
        ['Active Radars', headline.active_radar_count || 0],
        ['My Open Follow-ups', headline.open_action_count || 0],
      ].map(([label, value]) => `
        <article class="card metric-card">
          <p class="eyebrow">${escapeHtml(label)}</p>
          <div class="card-number">${escapeHtml(value)}</div>
        </article>`).join('');

      document.getElementById('teamLoadList').innerHTML = (data.teamLoad || []).map((team) => `
        <article class="list-row compact-row" style="cursor:default">
          <header>
            <div>
              <h4>${escapeHtml(team.name)}</h4>
              <p class="muted">${escapeHtml(team.team_key)}</p>
            </div>
            <span class="badge blue">${escapeHtml(team.active_students)} active</span>
          </header>
        </article>`).join('');

      document.getElementById('dashboardUpcoming').innerHTML =
        (data.upcomingFollowUps || []).map(renderMeetingRecord).join('') || '<p class="muted">No open follow-ups assigned to you.</p>';
      bindStudentLinks();

      const dslList = document.getElementById('dslConcernList');
      if (dslList) {
        const concerns = data.openSafeguardingConcerns || [];
        dslList.innerHTML = concerns.map((c) => `
          <article class="list-row compact-row" data-student-link="${c.student_id}">
            <header>
              <div>
                <h4>${escapeHtml(c.title)}</h4>
                <p class="muted">${escapeHtml(c.first_name)} ${escapeHtml(c.last_name)} | ${escapeHtml(c.student_code)} | Y${escapeHtml(c.year_group || '?')}</p>
              </div>
              <div style="display:flex;gap:4px;align-items:center">
                ${concernStatusBadge(c.status)}
                <span class="badge ${c.severity === 'high' ? 'danger' : c.severity === 'medium' ? 'warn' : ''}">${escapeHtml(c.severity)}</span>
              </div>
            </header>
            ${c.referral_type && c.referral_type !== 'none' ? `<p class="muted small">Referral: ${escapeHtml(c.referral_type.toUpperCase())}</p>` : ''}
            <p class="muted small">${escapeHtml(c.submitted_by_name || 'Unknown')} | ${escapeHtml(c.team_name || 'No team')} | ${escapeHtml(formatDate(c.updated_at, true))}</p>
          </article>`).join('') || '<p class="muted">No open safeguarding concerns.</p>';
        bindStudentLinks();
      }
    });
  }

  function renderStudentsPage() {
    setPageTitle('Students');
    const target = document.getElementById('studentsPage');
    const savedOptions = (state.bootstrap.savedFilters || [])
      .filter((entry) => entry.area_key === 'students')
      .map((entry) => `<option value="${escapeHtml(entry.filter_expression)}">${escapeHtml(entry.name)}</option>`)
      .join('');
    const teamOptions = (state.bootstrap.teams || [])
      .map((team) => `<option value="${escapeHtml(team.team_key)}">${escapeHtml(team.name)}</option>`)
      .join('');
    const isAdvanced = state.route.filterMode === 'advanced';

    target.innerHTML = `
      <section class="panel compact-panel">
        <div class="panel-header">
          <div>
            <p class="eyebrow">Directory</p>
            <h3 class="section-title">Students</h3>
          </div>
          <div class="table-actions">
            <div class="segmented">
              <button class="button ${!isAdvanced ? '' : 'secondary'}" id="builderModeButton">Builder</button>
              <button class="button ${isAdvanced ? '' : 'secondary'}" id="advancedModeButton">Advanced</button>
            </div>
            ${hasPermission('students.manage') ? '<button class="button" id="newStudentToggle">New student</button>' : ''}
          </div>
        </div>
        <div id="newStudentForm" class="inline-form hidden">
          <div class="form-grid">
            <input id="newFirstName" placeholder="First name">
            <input id="newLastName" placeholder="Last name">
            <input id="newPreferredName" placeholder="Preferred name">
            <input id="newStudentCode" placeholder="Student code">
            <input id="newYearGroup" placeholder="Year group">
            <input id="newTutorGroup" placeholder="Class / tutor group">
            <button class="button span-2" id="createStudentButton">Create student</button>
          </div>
        </div>
        <div class="student-filter-shell">
        <div id="builderFilters" class="filter-builder ${isAdvanced ? 'hidden' : ''}">
          <input id="studentSearch" class="search-input" value="${escapeHtml(state.route.q)}" placeholder="Search name or code">
          <input id="filterYear" placeholder="Year / class">
          <select id="filterRadar"><option value="">Any radar</option>${teamOptions}</select>
          <select id="filterStatus"><option value="">Any status</option><option value="active">Active</option><option value="monitoring">Monitoring</option><option value="closed">Closed</option></select>
          <input id="filterLead" placeholder="Lead">
          <input id="filterLatestAfter" type="date" title="Activity after">
          <input id="filterLatestBefore" type="date" title="Activity before">
          <button class="button" id="applyBuilderFilter">Apply</button>
        </div>
        <div id="advancedFilters" class="toolbar advanced-toolbar ${isAdvanced ? '' : 'hidden'}">
          <input id="studentFilter" class="filter-input" value="${escapeHtml(state.route.filter)}" placeholder="Advanced filter, e.g. radar==safeguarding;latestActivity>=2026-01-01">
          <select id="studentSavedFilter"><option value="">Saved filters</option>${savedOptions}</select>
          <button class="button" id="applyStudentFilter">Apply</button>
          <button class="button secondary" id="saveStudentFilter">Save view</button>
        </div>
        <div class="filter-switch">
          <div class="chip-row" id="studentFilterChips">${renderFilterChips(state.route.filter)}</div>
          <div class="filter-mode-actions">
            ${savedOptions ? `<select id="builderSavedFilter" class="saved-filter-select"><option value="">Saved filters</option>${savedOptions}</select>` : ''}
            <label class="check-control"><input id="filterOpenFollowUp" type="checkbox"> Open follow-up</label>
            <button class="text-button" id="clearStudentFilters">Clear</button>
          </div>
        </div>
        </div>
      </section>
      <section class="panel compact-panel student-table-panel">
        <div id="studentTable" class="table-scroll">${skeletonRows(10)}</div>
      </section>
    `;

    const toggle = document.getElementById('newStudentToggle');
    if (toggle) toggle.onclick = () => document.getElementById('newStudentForm').classList.toggle('hidden');
    document.getElementById('builderModeButton').onclick = () => updateRoute({ page: 'students', filterMode: 'builder' });
    document.getElementById('advancedModeButton').onclick = () => updateRoute({ page: 'students', filterMode: 'advanced' });
    document.getElementById('applyBuilderFilter').onclick = () => {
      updateRoute({ page: 'students', q: document.getElementById('studentSearch').value, filter: buildStudentFilterFromBuilder(), filterMode: 'builder' });
    };
    document.getElementById('applyStudentFilter').onclick = () => {
      updateRoute({ page: 'students', q: state.route.q, filter: document.getElementById('studentFilter').value, filterMode: 'advanced' });
    };
    document.getElementById('studentSavedFilter').onchange = (event) => {
      document.getElementById('studentFilter').value = event.target.value;
    };
    document.getElementById('saveStudentFilter').onclick = () => {
      const name = window.prompt('Name this filter');
      if (!name) return;
      callServer({
        path: '/api/saved-filters',
        method: 'post',
        payload: { areaKey: 'students', name, filterExpression: document.getElementById('studentFilter').value },
      }).then(() => {
        showMessage('Filter saved.');
        bustCache('settings:reference');
        bootstrapApp();
      });
    };
    document.getElementById('clearStudentFilters').onclick = () => updateRoute({ page: 'students', q: '', filter: '', filterMode: 'builder' });
    const builderSaved = document.getElementById('builderSavedFilter');
    if (builderSaved) builderSaved.onchange = (event) => {
      if (event.target.value) updateRoute({ page: 'students', filter: event.target.value, filterMode: 'builder' });
    };
    const createButton = document.getElementById('createStudentButton');
    if (createButton) {
      createButton.onclick = () => {
        callServer({
          path: '/api/students',
          method: 'post',
          payload: {
            firstName: document.getElementById('newFirstName').value,
            lastName: document.getElementById('newLastName').value,
            preferredName: document.getElementById('newPreferredName').value,
            studentCode: document.getElementById('newStudentCode').value,
            yearGroup: document.getElementById('newYearGroup').value,
            tutorGroup: document.getElementById('newTutorGroup').value,
          },
        }).then((result) => {
          showMessage('Student created.');
          updateRoute({ page: 'student-profile', studentId: result.student.id });
        });
      };
    }

    const studentCacheKey = 'students:' + (state.route.q || '') + ':' + (state.route.filter || '');
    const cachedStudents = getCached(studentCacheKey);
    const studentsPromise = cachedStudents
      ? Promise.resolve(cachedStudents)
      : callServer({ path: '/api/students', method: 'get', query: { q: state.route.q, filter: state.route.filter } }).then((data) => { setCached(studentCacheKey, data); return data; });
    studentsPromise.then((data) => {
      const students = data.students || [];
      if (!students.length) {
        document.getElementById('studentTable').innerHTML = '<p class="muted">No students matched this view.</p>';
        return;
      }
      document.getElementById('studentTable').innerHTML = `
        <table class="data-table dense-table">
          <thead><tr><th>Name</th><th>Year/Class</th><th>Radars</th><th>Lead</th><th>Latest</th><th>Status</th></tr></thead>
          <tbody>
            ${students.map((student) => `
              <tr data-student-id="${student.id}">
                <td><strong>${escapeHtml(studentName(student))}</strong><br><span class="muted small">${escapeHtml(student.student_code)}</span></td>
                <td>${escapeHtml(student.year_group || '')}<br><span class="muted small">${escapeHtml(student.tutor_group || '')}</span></td>
                <td><div class="badge-row">${(student.radar || []).map(radarBadge).join('') || '<span class="muted small">None</span>'}</div></td>
                <td>${escapeHtml(student.lead_name || 'Unassigned')}</td>
                <td>${escapeHtml(formatDate(student.latest_activity_at, true))}</td>
                <td><span class="badge">${escapeHtml(student.current_status)}</span></td>
              </tr>`).join('')}
          </tbody>
        </table>`;
      Array.from(document.querySelectorAll('[data-student-id]')).forEach((row) => {
        row.onclick = () => updateRoute({ page: 'student-profile', studentId: row.dataset.studentId });
      });
    });
  }

  function profileActionForm(action, data) {
    const teams = (state.bootstrap.teams || []).map((team) => `<option value="${team.id}">${escapeHtml(team.name)}</option>`).join('');
    const studentId = state.route.studentId;
    const forms = {
      note: `
        <div class="form-grid">
          <input id="noteSummary" class="span-2" placeholder="Short note summary">
          <textarea id="noteBody" class="span-2" rows="3" placeholder="Support note"></textarea>
          <select id="noteTeam"><option value="">No team</option>${teams}</select>
          <button class="button" id="submitNote">Add note</button>
        </div>`,
      meeting: `
        <div class="form-grid">
          <input id="meetingTitle" placeholder="Meeting title">
          <input id="meetingOccurredAt" type="datetime-local">
          <select id="meetingType"><option value="student_check_in">Student check-in</option><option value="parent_contact">Parent contact</option><option value="review_meeting">Review meeting</option><option value="external_agency">External agency</option><option value="team_around_family">Team around family</option></select>
          <select id="meetingTeam"><option value="">No team</option>${teams}</select>
          <textarea id="meetingSummary" class="span-2" rows="3" placeholder="Shareable summary"></textarea>
          <div class="span-2" id="meetingExternalFields" style="display:none">
            <div class="form-grid">
              <select id="meetingExternalAgency">
                <option value="">Select agency</option>
                <option value="mash">MASH</option>
                <option value="camhs">CAMHS</option>
                <option value="social_care">Social care</option>
                <option value="early_help">Early help</option>
                <option value="police">Police</option>
                <option value="lado">LADO</option>
                <option value="educational_psychologist">Ed. psychologist</option>
                <option value="other">Other</option>
              </select>
              <input id="meetingExternalContact" placeholder="Contact name (optional)">
              <input id="meetingExternalRef" class="span-2" placeholder="Case / reference number (optional)">
            </div>
          </div>
          <button class="button span-2" id="submitMeeting">Log meeting</button>
        </div>`,
      concern: `
        <div class="form-grid">
          <input id="concernTitle" placeholder="Concern title">
          <select id="concernCategory"><option value="attendance">Attendance</option><option value="behaviour">Behaviour</option><option value="safeguarding">Safeguarding</option><option value="wellbeing">Wellbeing</option></select>
          <select id="concernSeverity"><option value="low">Low</option><option value="medium" selected>Medium</option><option value="high">High</option></select>
          <select id="concernTeam"><option value="">No team</option>${teams}</select>
          <textarea id="concernSummary" class="span-2" rows="3" placeholder="Short operational summary"></textarea>
          <div class="span-2" id="concernSafeguardingFields" style="display:none">
            <div class="form-grid">
              <select id="concernReferralType">
                <option value="none">No referral made</option>
                <option value="mash">MASH referral</option>
                <option value="lado">LADO referral</option>
                <option value="police">Police</option>
                <option value="early_help">Early help</option>
                <option value="camhs">CAMHS</option>
                <option value="social_care">Social care</option>
                <option value="other">Other</option>
              </select>
              <input id="concernReferralDate" type="date" title="Referral date">
              <textarea id="concernReferralOutcome" class="span-2" rows="2" placeholder="Referral outcome / agency response (optional at this stage)"></textarea>
            </div>
          </div>
          <div class="span-2" id="concernBehaviourFields" style="display:none">
            <div class="form-grid">
              <select id="concernIncidentType">
                <option value="">Incident type</option>
                <option value="verbal">Verbal abuse / aggression</option>
                <option value="physical">Physical aggression</option>
                <option value="disruption">Persistent disruption</option>
                <option value="bullying">Bullying</option>
                <option value="online">Online / cyberbullying</option>
                <option value="damage">Property damage</option>
                <option value="substance">Substance related</option>
                <option value="other">Other</option>
              </select>
              <select id="concernSanctionType">
                <option value="none">No sanction</option>
                <option value="verbal_warning">Verbal warning</option>
                <option value="detention">Detention</option>
                <option value="isolation">Internal isolation</option>
                <option value="ftes">Fixed-term exclusion</option>
                <option value="managed_move">Managed move</option>
                <option value="permanent_exclusion">Permanent exclusion</option>
              </select>
              <input id="concernSanctionDuration" placeholder="Sanction duration (e.g. 2 days)">
              <label class="check-control"><input id="concernBehaviourPlanActive" type="checkbox"> Behaviour plan in place</label>
            </div>
          </div>
          <button class="button span-2" id="submitConcern">Log concern</button>
        </div>`,
      followup: `
        <div class="form-grid">
          <input id="followTitle" placeholder="Follow-up title">
          <input id="followDueAt" type="date">
          <select id="followStatus"><option value="open">Open</option><option value="in_progress">In progress</option><option value="completed">Completed</option><option value="cancelled">Cancelled</option></select>
          <select id="followPriority"><option value="low">Low</option><option value="medium" selected>Medium</option><option value="high">High</option></select>
          <select id="followTeam"><option value="">No team</option>${teams}</select>
          <select id="followVisibility"><option value="summary">Summary</option><option value="indicator">Indicator</option><option value="full">Full</option></select>
          <textarea id="followSummary" class="span-2" rows="3" placeholder="What needs to happen?"></textarea>
          <button class="button span-2" id="submitFollow">Add follow-up</button>
        </div>`,
      radar: `
        <div class="form-grid">
          <select id="radarTeam" class="span-2">${teams}</select>
          <select id="radarSeverity"><option value="low">Low</option><option value="medium" selected>Medium</option><option value="high">High</option></select>
          <select id="radarStatus"><option value="active">Active</option><option value="monitoring">Monitoring</option></select>
          <textarea id="radarSummary" class="span-2" rows="3" placeholder="Why is this student on this radar?"></textarea>
          <button class="button span-2" id="submitRadar">Add radar</button>
        </div>`,
      status: `
        <div class="form-grid">
          <select id="studentStatus" class="span-2"><option value="active">Active</option><option value="monitoring">Monitoring</option><option value="closed">Closed</option><option value="archived">Archived</option></select>
          <button class="button span-2" id="submitStatus">Update status</button>
        </div>`,
      closeconcern: (() => {
        const openConcerns = (data && data.concerns || []).filter((c) => ['open','triage','escalated'].includes(c.status));
        if (!openConcerns.length) return '<p class="muted small">No open concerns to close.</p>';

        </div>`,
    };
    return forms[action] ? `<section class="panel inline-action-panel">${forms[action]}</section>` : '';

  function postProfile(path, payload) {
    if (state.profileSaving) return;
    state.profileSaving = true;
    Array.from(document.querySelectorAll('[data-profile-action], #profileActionHost .button')).forEach((button) => {
      button.disabled = true;
    });
    callServer({ path, method: 'post', payload }).then(() => {
      showMessage('Saved.');
      bustCache('dashboard');
      state.activeProfileAction = '';
      document.getElementById('profileActionHost').innerHTML = '';
      Array.from(document.querySelectorAll('[data-profile-action]')).forEach((btn) => {
        btn.className = 'button secondary';
        btn.disabled = false;
      });
      return callServer({ path: '/api/students/' + encodeURIComponent(state.route.studentId), method: 'get' });
    }).then((data) => {
      if (!data) return;
      state.profileData = data;
      const timeline = document.querySelector('.timeline');
      if (timeline) timeline.innerHTML = buildTimeline(data);
      const radarRow = document.querySelector('.profile-heading .badge-row');
      if (radarRow) radarRow.innerHTML = (data.radar || []).filter((r) => ['active', 'monitoring'].includes(r.status)).map(radarBadge).join('') || '<span class="muted small">No active radar</span>';
    }).finally(() => {
      state.profileSaving = false;
    });
  }

  function concernStatusBadge(status) {
    const cls = { open: '', triage: 'warn', escalated: 'danger', resolved: '', closed: 'secondary' }[status] || '';
    return `<span class="badge ${cls}">${escapeHtml(friendlyLabel(status))}</span>`;
  }

  function buildTimeline(data) {
    const chronologyRefs = new Set((data.chronology || [])
      .map((item) => item.source_table && item.source_id ? item.source_table + ':' + item.source_id : '')
      .filter(Boolean));
    const includeEntity = (table, item) => !chronologyRefs.has(table + ':' + item.id);
    const items = []
      .concat((data.chronology || []).map((item) => ({ ...item, source: item.event_type || 'event' })))
      .concat((data.notes || []).filter((item) => includeEntity('notes', item)).map((item) => ({ ...item, source: 'note_added' })))
      .concat((data.meetings || []).filter((item) => includeEntity('meetings', item)).map((item) => ({ ...item, source: 'meeting_logged' })))
      .concat((data.concerns || []).filter((item) => includeEntity('concerns', item)).map((item) => ({ ...item, source: 'concern_logged' })))
      .concat((data.actions || []).filter((item) => includeEntity('actions', item)).map((item) => ({ ...item, source: 'follow_up_created' })))
      .sort((a, b) => new Date(b.occurred_at || b.created_at) - new Date(a.occurred_at || a.created_at));
    if (!items.length) return '<p class="muted">No visible timeline activity yet.</p>';
    return items.slice(0, 80).map((item) => {
      const extraLines = [];
      if (item.action_taken) extraLines.push(`<p class="muted small"><strong>Action:</strong> ${escapeHtml(item.action_taken)}</p>`);
      if (item.outcome) extraLines.push(`<p class="muted small"><strong>Outcome:</strong> ${escapeHtml(item.outcome)}</p>`);
      if (item.outcome_summary && !item.outcome) extraLines.push(`<p class="muted small"><strong>Outcome:</strong> ${escapeHtml(item.outcome_summary)}</p>`);
      if (item.referral_type && item.referral_type !== 'none') extraLines.push(`<p class="muted small"><strong>Referral:</strong> ${escapeHtml(item.referral_type.toUpperCase())}${item.referral_date ? ' — ' + escapeHtml(formatDate(item.referral_date, true)) : ''}</p>`);
      if (item.external_agency) extraLines.push(`<p class="muted small"><strong>Agency:</strong> ${escapeHtml(friendlyLabel(item.external_agency))}</p>`);
      if (item.next_step) extraLines.push(`<p class="muted small"><strong>Next:</strong> ${escapeHtml(item.next_step)}${item.next_step_due ? ' by ' + escapeHtml(formatDate(item.next_step_due, true)) : ''}${item.next_step_owner_name ? ' (' + escapeHtml(item.next_step_owner_name) + ')' : ''}</p>`);
      if (item.closed_at) extraLines.push(`<p class="muted small"><strong>Closed:</strong> ${escapeHtml(formatDate(item.closed_at, true))}${item.closed_by_name ? ' by ' + escapeHtml(item.closed_by_name) : ''}</p>`);
      return `
      <div class="timeline-item">
        <div class="timeline-head">
          <h4>${escapeHtml(item.title || friendlyLabel(item.source))}</h4>
          <span class="badge">${escapeHtml(friendlyLabel(item.source || 'event'))}</span>
        </div>
        <p>${escapeHtml(item.summary || 'Protected event')}</p>
        ${extraLines.join('')}
        <p class="muted small">${escapeHtml(item.team_name || 'School record')} | ${escapeHtml(friendlyVisibility(item.visibility || item.visibility_level || 'summary'))} | ${escapeHtml(formatDate(item.occurred_at || item.created_at))}</p>
      </div>`;
    }).join('');
  }

      <div class="two-col">
        <article class="panel compact-panel"><h3 class="section-title">Users</h3><div class="table-scroll"><table class="data-table dense-table"><thead><tr><th>Name</th><th>Email</th><th>Status</th></tr></thead><tbody>${(data.users || []).map((u) => `<tr><td>${escapeHtml(u.display_name)}</td><td>${escapeHtml(u.email)}</td><td>${u.is_active ? 'Active' : 'Inactive'}</td></tr>`).join('')}</tbody></table></div></article>
        <article class="panel compact-panel"><h3 class="section-title">Add User</h3><div class="form-grid"><input id="userEmail" class="span-2" placeholder="user@school.org"><input id="userDisplayName" class="span-2" placeholder="Display name"><select id="userPrimaryTeam">${(data.teams || []).map((t) => `<option value="${t.id}">${escapeHtml(t.name)}</option>`).join('')}</select><select id="userActive"><option value="true">Active</option><option value="false">Inactive</option></select><button class="button span-2" id="saveUserButton">Save user</button></div></article>
      </div>`;
  }

  function renderUserRolesSettings(data) {
    const users = data.users || [];
    const roles = data.roles || [];
    const userRoles = data.userRoles || [];
    const byUser = {};
    users.forEach((u) => { byUser[u.id] = { user: u, roleIds: [] }; });
    userRoles.forEach((ur) => { if (byUser[ur.user_id]) byUser[ur.user_id].roleIds.push(ur.role_id); });
    const userOptions = users.map((u) => `<option value="${escapeHtml(u.id)}">${escapeHtml(u.display_name)} &lt;${escapeHtml(u.email)}&gt;</option>`).join('');
    const roleOptions = roles.map((r) => `<option value="${escapeHtml(r.id)}">${escapeHtml(r.name)}</option>`).join('');
    const rows = users.map((u) => {
      const assigned = userRoles.filter((ur) => ur.user_id === u.id).map((ur) => `<span class="chip">${escapeHtml(ur.role_name)}</span>`).join('') || '<span class="muted small">No roles</span>';
      return `<tr><td><strong>${escapeHtml(u.display_name)}</strong><br><span class="muted small">${escapeHtml(u.email)}</span></td><td>${assigned}</td></tr>`;
    }).join('');
    return `
      <div class="two-col">
        <article class="panel compact-panel">
          <h3 class="section-title">Current Assignments</h3>
          <div class="table-scroll"><table class="data-table dense-table"><thead><tr><th>User</th><th>Roles</th></tr></thead><tbody>${rows}</tbody></table></div>
        </article>
        <article class="panel compact-panel">
          <h3 class="section-title">Assign or Remove Role</h3>
          <div class="form-grid">
            <select id="urUserId" class="span-2">${userOptions}</select>
            <select id="urRoleId" class="span-2">${roleOptions}</select>
            <button class="button" id="assignRoleButton">Assign role</button>
            <button class="button secondary" id="removeRoleButton">Remove role</button>
          </div>
          <p class="muted small" style="margin-top:8px">Roles control what a user can see and do across the whole app. The Admin role bypasses all permission checks.</p>
        </article>
      </div>`;
  }

  function renderRolesSettings(data) {
    return `
      <div class="two-col">
        <article class="panel compact-panel"><h3 class="section-title">Roles</h3><div class="table-scroll"><table class="data-table dense-table"><thead><tr><th>Role</th><th>Description</th></tr></thead><tbody>${(data.roles || []).map((r) => `<tr><td>${escapeHtml(r.name)}</td><td>${escapeHtml(r.description || '')}</td></tr>`).join('')}</tbody></table></div></article>
        <article class="panel compact-panel"><h3 class="section-title">Custom Role</h3><div class="form-grid"><input id="roleKey" placeholder="Short code"><input id="roleName" placeholder="Role name"><textarea id="roleDescription" class="span-2" rows="2" placeholder="Description"></textarea><select id="rolePermissions" class="span-2" multiple size="8">${(data.permissions || []).map((p) => `<option value="${p.permission_key}">${escapeHtml(p.description || friendlyLabel(p.permission_key))}</option>`).join('')}</select><button class="button span-2" id="saveRoleButton">Save role</button></div></article>
      </div>`;
  }

  function renderTeamsSettings(data) {
    return `
      <div class="two-col">
        <article class="panel compact-panel"><h3 class="section-title">Teams</h3><div class="table-scroll"><table class="data-table dense-table"><thead><tr><th>Team</th><th>Short Code</th><th>Active</th></tr></thead><tbody>${(data.teams || []).map((t) => `<tr><td>${escapeHtml(t.name)}</td><td>${escapeHtml(t.team_key)}</td><td>${t.is_active ? 'Yes' : 'No'}</td></tr>`).join('')}</tbody></table></div></article>
        <article class="panel compact-panel"><h3 class="section-title">Add Team</h3><div class="form-grid"><input id="teamKey" placeholder="Short code"><input id="teamName" placeholder="Team name"><input id="teamAccentColor" value="#2F6B66" placeholder="#2F6B66"><select id="teamActive"><option value="true">Active</option><option value="false">Inactive</option></select><textarea id="teamDescription" class="span-2" rows="2" placeholder="Description"></textarea><button class="button span-2" id="saveTeamButton">Save team</button></div></article>
      </div>`;
  }

  function renderVisibilitySettings(data) {
    const teamOptions = (data.teams || []).map((t) => `<option value="${t.id}">${escapeHtml(t.name)}</option>`).join('');
    const rows = (data.visibilityRules || []).map((r) => `
      <tr>
        <td>${escapeHtml(r.source_team_name)}</td>
        <td>${escapeHtml(r.target_team_name)}</td>
        <td>${escapeHtml(friendlyLabel(r.content_type))}</td>
        <td>${escapeHtml(friendlyVisibility(r.visibility_level))}</td>
        <td><button class="text-button" data-edit-rule
          data-source="${escapeHtml(r.source_team_id)}"
          data-target="${escapeHtml(r.target_team_id)}"
          data-content="${escapeHtml(r.content_type)}"
          data-level="${escapeHtml(r.visibility_level)}">Edit</button></td>
      </tr>`).join('');
    return `
      <article class="panel compact-panel">
        <div class="panel-header">
          <div><h3 class="section-title">Team Sharing</h3></div>
          <button class="button secondary" id="addRuleToggle">+ Add rule</button>
        </div>
        <div id="visibilityRuleForm" class="inline-form hidden" style="margin-bottom:10px">
          <div class="form-grid">
            <select id="visibilitySource">${teamOptions}</select>
            <select id="visibilityTarget">${teamOptions}</select>
            <select id="visibilityContent"><option value="radar">Radar records</option><option value="concerns">Concerns</option><option value="meetings">Meetings</option><option value="actions">Follow-ups</option><option value="chronology">Timeline</option></select>
            <select id="visibilityLevel"><option value="none">Hidden</option><option value="indicator">Exists only</option><option value="summary">Summary</option><option value="full">Full detail</option></select>
            <button class="button" id="saveVisibilityButton">Save rule</button>
            <button class="button secondary" id="cancelVisibilityButton">Cancel</button>
          </div>
        </div>
        <div class="table-scroll"><table class="data-table dense-table"><thead><tr><th>Whose data</th><th>Who can see it</th><th>What they can see</th><th>How much</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>
      </article>`;
  }

  function renderSavedFiltersSettings(data) {
    return `<article class="panel compact-panel"><h3 class="section-title">Saved Filters</h3><div class="table-scroll"><table class="data-table dense-table"><thead><tr><th>Name</th><th>Area</th><th>Advanced Filter</th><th>Shared</th></tr></thead><tbody>${(data.savedFilters || []).map((f) => `<tr><td>${escapeHtml(f.name)}</td><td>${escapeHtml(friendlyLabel(f.area_key))}</td><td><code>${escapeHtml(f.filter_expression)}</code></td><td>${f.is_shared ? 'Yes' : 'No'}</td></tr>`).join('')}</tbody></table></div></article>`;
  }

  function bindSettingsForms() {
    const saveUserButton = document.getElementById('saveUserButton');
    if (saveUserButton) saveUserButton.onclick = () => callServer({ path: '/api/settings/users', method: 'post', payload: { email: document.getElementById('userEmail').value, displayName: document.getElementById('userDisplayName').value, primaryTeamId: document.getElementById('userPrimaryTeam').value, isActive: document.getElementById('userActive').value === 'true' } }).then(() => { bustCache('settings:reference'); showMessage('User saved.'); });
    const assignRoleButton = document.getElementById('assignRoleButton');
    if (assignRoleButton) assignRoleButton.onclick = () => callServer({ path: '/api/settings/user-roles', method: 'post', payload: { userId: document.getElementById('urUserId').value, roleId: document.getElementById('urRoleId').value, action: 'assign' } }).then(() => { bustCache('settings:reference'); updateRoute({ page: 'settings', settingsTab: 'user-roles' }); });
    const removeRoleButton = document.getElementById('removeRoleButton');
    if (removeRoleButton) removeRoleButton.onclick = () => callServer({ path: '/api/settings/user-roles', method: 'post', payload: { userId: document.getElementById('urUserId').value, roleId: document.getElementById('urRoleId').value, action: 'remove' } }).then(() => { bustCache('settings:reference'); updateRoute({ page: 'settings', settingsTab: 'user-roles' }); });
    const saveRoleButton = document.getElementById('saveRoleButton');
    if (saveRoleButton) saveRoleButton.onclick = () => callServer({ path: '/api/settings/roles', method: 'post', payload: { roleKey: document.getElementById('roleKey').value, name: document.getElementById('roleName').value, description: document.getElementById('roleDescription').value, permissionKeys: Array.from(document.getElementById('rolePermissions').selectedOptions).map((o) => o.value) } }).then(() => { bustCache('settings:reference'); showMessage('Role saved.'); });
    const saveTeamButton = document.getElementById('saveTeamButton');
    if (saveTeamButton) saveTeamButton.onclick = () => callServer({ path: '/api/settings/teams', method: 'post', payload: { teamKey: document.getElementById('teamKey').value, name: document.getElementById('teamName').value, description: document.getElementById('teamDescription').value, accentColor: document.getElementById('teamAccentColor').value, isActive: document.getElementById('teamActive').value === 'true' } }).then(() => { bustCache('settings:reference'); showMessage('Team saved.'); });
    const ruleForm = document.getElementById('visibilityRuleForm');
    const addRuleToggle = document.getElementById('addRuleToggle');
    const cancelVisibilityButton = document.getElementById('cancelVisibilityButton');
    if (addRuleToggle) addRuleToggle.onclick = () => { ruleForm.classList.remove('hidden'); addRuleToggle.classList.add('hidden'); };
    if (cancelVisibilityButton) cancelVisibilityButton.onclick = () => { ruleForm.classList.add('hidden'); addRuleToggle.classList.remove('hidden'); };
    const saveVisibilityButton = document.getElementById('saveVisibilityButton');
    if (saveVisibilityButton) saveVisibilityButton.onclick = () => callServer({ path: '/api/settings/visibility-rules', method: 'post', payload: { sourceTeamId: document.getElementById('visibilitySource').value, targetTeamId: document.getElementById('visibilityTarget').value, contentType: document.getElementById('visibilityContent').value, visibilityLevel: document.getElementById('visibilityLevel').value } }).then(() => { bustCache('settings:reference'); updateRoute({ page: 'settings', settingsTab: 'visibility' }); showMessage('Sharing rule saved.'); });
    Array.from(document.querySelectorAll('[data-edit-rule]')).forEach((btn) => {
      btn.onclick = () => {
        const setVal = (id, val) => { const el = document.getElementById(id); if (el) el.value = val; };
        setVal('visibilitySource', btn.dataset.source);
        setVal('visibilityTarget', btn.dataset.target);
        setVal('visibilityContent', btn.dataset.content);
        setVal('visibilityLevel', btn.dataset.level);
        ruleForm.classList.remove('hidden');
        addRuleToggle.classList.add('hidden');
        ruleForm.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      };
    });
  }

  function loadAuditLog() {
    callServer({ path: '/api/audit-logs', method: 'get' }).then((data) => {
      document.getElementById('auditLogTable').innerHTML = `<div class="table-scroll"><table class="data-table dense-table"><thead><tr><th>When</th><th>Actor</th><th>Area</th><th>Action</th><th>Student</th></tr></thead><tbody>${(data.auditLogs || []).map((entry) => `<tr><td>${escapeHtml(formatDate(entry.created_at))}</td><td>${escapeHtml(entry.actor_name || 'Automated')}</td><td>${escapeHtml(friendlyLabel(entry.area_key))}</td><td>${escapeHtml(friendlyLabel(entry.action_key))}</td><td>${entry.student_code ? escapeHtml(entry.student_code + ' | ' + entry.first_name + ' ' + entry.last_name) : ''}</td></tr>`).join('')}</tbody></table></div>`;
    });
  }

  function renderRoute() {
    showMessage('');
    ['dashboardPage', 'studentsPage', 'studentProfilePage', 'meetingsPage', 'settingsPage'].forEach((id) => document.getElementById(id).classList.add('hidden'));
    renderNav();
    const page = state.route.page;
    if (page === 'dashboard') {
      document.getElementById('dashboardPage').classList.remove('hidden');
      renderDashboard();
    } else if (page === 'students') {
      document.getElementById('studentsPage').classList.remove('hidden');
      renderStudentsPage();
    } else if (page === 'student-profile') {
      document.getElementById('studentProfilePage').classList.remove('hidden');
      renderStudentProfilePage();
    } else if (page === 'meetings') {
      document.getElementById('meetingsPage').classList.remove('hidden');
      renderMeetingsPage();
    } else if (page === 'settings') {
      document.getElementById('settingsPage').classList.remove('hidden');
      renderSettingsPage();
    } else {
      updateRoute({ page: 'dashboard', studentId: '', settingsTab: '' });
    }
  }

  function bootstrapApp() {
    parseRoute();
    google.script.run
      .withSuccessHandler((data) => {
        state.bootstrap = data;
        document.getElementById('currentUserPill').textContent = data.currentUser.displayName + ' | ' + data.currentUser.email;
        renderRoute();
      })
      .withFailureHandler((error) => {
        setStatus('Error');
        showMessage('Unable to load the app. Please try again or contact support.', 'error');
      })
      .getBootstrapData();
  }

  window.addEventListener('popstate', () => {
    parseRoute();
    renderRoute();
  });

  bootstrapApp();
</script>
