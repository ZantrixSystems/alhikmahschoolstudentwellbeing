<script>
  const state = {
    bootstrap: null,
    route: {},
    activeProfileAction: '',
    profileData: null,
    profileSaving: false,
    profileTab: 'overview',
    dropdownSettingsField: 'incident_type',
    visibilityEditMode: false,
    visibilityPending: {},
    directoryCache: null,
    pageCache: {},
  };

  const PAGE_CACHE_TTL = 300000; // 5 minutes
  let renderGeneration = 0;

  function getCached(key) {
    const entry = state.pageCache[key];
    if (!entry) return null;
    if (Date.now() - entry.ts > PAGE_CACHE_TTL) { delete state.pageCache[key]; return null; }
    return entry.data;
  }

  function setCached(key, data) {
    state.pageCache[key] = { ts: Date.now(), data };
  }

  function bustCache(key) {
    delete state.pageCache[key];
  }

  // Returns a guard function. Call it before painting async results — if the
  // render generation has moved on (user navigated away), returns false.
  function getRenderGuard() {
    const gen = ++renderGeneration;
    return () => renderGeneration === gen;
  }

  function setStatus(text) {
    const el = document.getElementById('globalStatus');
    if (el) el.textContent = text;
  }

  function showMessage(text, mode) {
    const el = document.getElementById('appMessage');
    if (!text) {
      el.classList.add('hidden');
      el.textContent = '';
      return;
    }
    el.classList.remove('hidden');
    el.textContent = text;
    el.style.borderColor = mode === 'error' ? 'rgba(179,63,63,0.28)' : 'var(--line)';
  }

  function callServer(request) {
    setStatus('Loading');
    return new Promise((resolve, reject) => {
      google.script.run
        .withSuccessHandler((result) => {
          setStatus('');
          resolve(result);
        })
        .withFailureHandler((error) => {
          console.error(error);
          setStatus('Error');
          const message = error && error.message ? String(error.message).replace(/^Error:\s*/, '') : '';
          showMessage(message || 'Something went wrong. Please try again or contact support.', 'error');
          reject(error);
        })
        .apiProxy(request);
    });
  }

  const ROUTE_SESSION_KEY = 'ahw_route';

  function parseRoute() {
    let parsed = {};
    try {
      const raw = sessionStorage.getItem(ROUTE_SESSION_KEY);
      if (raw) parsed = JSON.parse(raw);
    } catch (e) { /* sessionStorage unavailable or corrupt */ }
    state.route = {
      page: parsed.page || 'dashboard',
      studentId: parsed.studentId || '',
      q: parsed.q || '',
      filter: parsed.filter || '',
      filterMode: parsed.filterMode || (parsed.filter ? 'advanced' : 'builder'),
      view: parsed.view || 'calendar',
      settingsTab: parsed.settingsTab || 'users',
    };
  }

  function updateRoute(next) {
    const current = Object.assign({}, state.route);
    Object.keys(next).forEach((key) => {
      if (next[key]) current[key] = next[key];
      else delete current[key];
    });
    try { sessionStorage.setItem(ROUTE_SESSION_KEY, JSON.stringify(current)); } catch (e) {}
    parseRoute();
    renderRoute();
  }

  function hasPermission(permission) {
    const keys = (state.bootstrap.currentUser && state.bootstrap.currentUser.permissionKeys) || [];
    return keys.includes('*') || keys.includes(permission);
  }

  function escapeHtml(value) {
    return String(value || '')
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  function formatDate(value, dateOnly) {
    if (!value || String(value).startsWith('1970-01-01')) return 'Not set';
    const options = dateOnly ? { dateStyle: 'medium' } : { dateStyle: 'medium', timeStyle: 'short' };
    return new Date(value).toLocaleString([], options);
  }

  function friendlyLabel(value) {
    return String(value || '')
      .replace(/[._-]+/g, ' ')
      .replace(/\b\w/g, (letter) => letter.toUpperCase());
  }

  function friendlyVisibility(value) {
    const labels = { none: 'Hidden', indicator: 'Limited', summary: 'Summary', full: 'Full' };
    return labels[value] || friendlyLabel(value);
  }

  function studentName(student) {
    return [student.preferred_name || student.first_name, student.last_name].filter(Boolean).join(' ');
  }

  function radarBadge(radar) {
    return `<span class="radar-badge radar-${escapeHtml(radar.teamKey || radar.team_key || 'general')}">${escapeHtml(radar.teamName || radar.team_name || 'Radar')}</span>`;
  }

  function renderFilterChips(expression) {
    if (!expression) return '<span class="muted small">No filters applied.</span>';
    return expression
      .split(/(?=[;,])/)
      .map((part) => part.replace(/^[;,]/, '').trim())
      .filter(Boolean)
      .map((part) => `<span class="chip">${escapeHtml(part)}</span>`)
      .join('');
  }

  function buildStudentFilterFromBuilder() {
    const parts = [];
    const year = document.getElementById('filterYear').value;
    const radar = document.getElementById('filterRadar').value;
    const status = document.getElementById('filterStatus').value;
    const lead = document.getElementById('filterLead').value;
    const latestAfter = document.getElementById('filterLatestAfter').value;
    const latestBefore = document.getElementById('filterLatestBefore').value;
    const openFollowUp = document.getElementById('filterOpenFollowUp').checked;
    if (year) parts.push('yearGroup==' + year);
    if (radar) parts.push('radar==' + radar);
    if (status) parts.push('status==' + status);
    if (lead) parts.push('lead~=' + lead.replace(/\s+/g, '_'));
    if (latestAfter) parts.push('latestActivity>=' + latestAfter);
    if (latestBefore) parts.push('latestActivity<=' + latestBefore);
    if (openFollowUp) parts.push('openFollowUp==true');
    return parts.join(';');
  }

  function renderNav() {
    const nav = document.getElementById('nav');
    // Build nav once; on subsequent calls just update active class without recreating buttons.
    if (!nav.dataset.built) {
      nav.innerHTML = '';
      (state.bootstrap.navigation || []).forEach((item) => {
        const button = document.createElement('button');
        button.className = 'nav-button';
        button.textContent = item.label;
        button.dataset.navKey = item.key;
        button.onclick = () => updateRoute({ page: item.key, studentId: '', settingsTab: '', filter: '', q: '' });
        nav.appendChild(button);
      });
      nav.dataset.built = '1';
    }
    Array.from(nav.querySelectorAll('[data-nav-key]')).forEach((btn) => {
      const isActive = state.route.page === btn.dataset.navKey || (btn.dataset.navKey === 'students' && state.route.page === 'student-profile');
      btn.className = 'nav-button' + (isActive ? ' active' : '');
    });
  }

  function setPageTitle(text) {
    document.getElementById('pageTitle').textContent = text;
  }

  function skeletonCards(count) {
    return Array.from({ length: count }, () => '<article class="skeleton-card"></article>').join('');
  }

  function skeletonRows(count) {
    return `<div class="skeleton-stack">${Array.from({ length: count }, () => '<div class="skeleton-row"></div>').join('')}</div>`;
  }

  function renderDashboard() {
    setPageTitle('Dashboard');
    const target = document.getElementById('dashboardPage');
    const showSafeguardingPanel = hasPermission('concerns.review');
    target.innerHTML = `
      <section class="grid-cards compact-metrics" id="headlineCards">${skeletonCards(4)}</section>
      <section class="two-col">
        <article class="panel">
          <div class="panel-header">
            <div>
              <p class="eyebrow">Radars</p>
              <h3 class="section-title">Team Load</h3>
            </div>
          </div>
          <div id="teamLoadList" class="list compact-list">${skeletonRows(4)}</div>
        </article>
        <article class="panel">
          <div class="panel-header">
            <div>
              <p class="eyebrow">Upcoming</p>
              <h3 class="section-title">My Follow-ups</h3>
            </div>
          </div>
          <div id="dashboardUpcoming" class="list compact-list">${skeletonRows(4)}</div>
        </article>
      </section>
      ${showSafeguardingPanel ? `
      <section class="panel compact-panel">
        <div class="panel-header">
          <div>
            <p class="eyebrow safeguarding-eyebrow">Safeguarding</p>
            <h3 class="section-title">Open Concerns</h3>
          </div>
        </div>
        <div id="dslConcernList" class="list compact-list">${skeletonRows(4)}</div>
      </section>` : ''}
    `;

    const guard = getRenderGuard();
    const cached = getCached('dashboard');

    function paintDashboard(data) {
      if (!guard()) return;
      setCached('dashboard', data);
      const headline = data.headline || {};
      document.getElementById('headlineCards').innerHTML = [
        ['Students', headline.student_count || 0],
        ['Open Concerns', headline.open_concern_count || 0],
        ['Active Radars', headline.active_radar_count || 0],
        ['My Open Follow-ups', headline.open_action_count || 0],
      ].map(([label, value]) => `
        <article class="card metric-card">
          <p class="eyebrow">${escapeHtml(label)}</p>
          <div class="card-number">${escapeHtml(value)}</div>
        </article>`).join('');

      document.getElementById('teamLoadList').innerHTML = (data.teamLoad || []).map((team) => `
        <article class="list-row compact-row" style="cursor:default">
          <header>
            <div>
              <h4>${escapeHtml(team.name)}</h4>
              <p class="muted">${escapeHtml(team.team_key)}</p>
            </div>
            <span class="badge blue">${escapeHtml(team.active_students)} active</span>
          </header>
        </article>`).join('');

      document.getElementById('dashboardUpcoming').innerHTML =
        (data.upcomingFollowUps || []).map(renderMeetingRecord).join('') || '<p class="muted">No open follow-ups assigned to you.</p>';
      bindStudentLinks();

      const dslList = document.getElementById('dslConcernList');
      if (dslList) {
        const concerns = data.openSafeguardingConcerns || [];
        dslList.innerHTML = concerns.map((c) => `
          <article class="list-row compact-row" data-student-link="${c.student_id}">
            <header>
              <div>
                <h4>${escapeHtml(c.title)}</h4>
                <p class="muted">${escapeHtml(c.first_name)} ${escapeHtml(c.last_name)} | ${escapeHtml(c.student_code)} | Y${escapeHtml(c.year_group || '?')}</p>
              </div>
              <div style="display:flex;gap:4px;align-items:center">
                ${concernStatusBadge(c.status)}
                <span class="badge ${c.severity === 'high' ? 'danger' : c.severity === 'medium' ? 'warn' : ''}">${escapeHtml(c.severity)}</span>
              </div>
            </header>
            ${c.referral_type && c.referral_type !== 'none' ? `<p class="muted small">Referral: ${escapeHtml(c.referral_type.toUpperCase())}</p>` : ''}
            <p class="muted small">${escapeHtml(c.submitted_by_name || 'Unknown')} | ${escapeHtml(c.team_name || 'No team')} | ${escapeHtml(formatDate(c.updated_at, true))}</p>
          </article>`).join('') || '<p class="muted">No open safeguarding concerns.</p>';
        bindStudentLinks();
      }
    }

    if (cached) {
      paintDashboard(cached);
      callServer({ path: '/api/dashboard', method: 'get' }).then(paintDashboard).catch(() => {});
    } else {
      callServer({ path: '/api/dashboard', method: 'get' }).then((data) => {
        paintDashboard(data);
        // Pre-warm student list so navigating to Students is instant
        if (!getCached('students::')) {
          callServer({ path: '/api/students', method: 'get', query: { q: '', filter: '' } })
            .then((sd) => setCached('students::', sd)).catch(() => {});
        }
      });
    }
  }

  function renderStudentsPage() {
    setPageTitle('Students');
    const target = document.getElementById('studentsPage');
    const savedOptions = (state.bootstrap.savedFilters || [])
      .filter((entry) => entry.area_key === 'students')
      .map((entry) => `<option value="${escapeHtml(entry.filter_expression)}">${escapeHtml(entry.name)}</option>`)
      .join('');
    const teamOptions = (state.bootstrap.teams || [])
      .map((team) => `<option value="${escapeHtml(team.team_key)}">${escapeHtml(team.name)}</option>`)
      .join('');
    const isAdvanced = state.route.filterMode === 'advanced';

    target.innerHTML = `
      <section class="panel compact-panel">
        <div class="panel-header">
          <div>
            <p class="eyebrow">Directory</p>
            <h3 class="section-title">Students</h3>
          </div>
          <div class="table-actions">
            <div class="segmented">
              <button class="button ${!isAdvanced ? '' : 'secondary'}" id="builderModeButton">Builder</button>
              <button class="button ${isAdvanced ? '' : 'secondary'}" id="advancedModeButton">Advanced</button>
            </div>
            ${hasPermission('students.manage') ? '<button class="button" id="newStudentToggle">Add student</button>' : ''}
          </div>
        </div>
        <div id="newStudentForm" class="inline-form hidden" style="background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:12px 14px;margin-top:8px">
          <p class="eyebrow" style="margin-bottom:8px">Find student</p>
          <div style="display:flex;gap:8px;align-items:center">
            <input id="directorySearch" class="search-input" placeholder="Type name or student ID…" style="flex:1;border-radius:8px" autocomplete="off">
            <button class="button secondary" id="cancelNewStudent" style="white-space:nowrap">Cancel</button>
          </div>
          <div id="directoryResults" style="margin-top:8px;border-radius:8px;overflow:hidden"></div>
        </div>
        <div class="student-filter-shell">
        <div id="builderFilters" class="filter-builder ${isAdvanced ? 'hidden' : ''}">
          <input id="studentSearch" class="search-input" value="${escapeHtml(state.route.q)}" placeholder="Search name or code">
          <input id="filterYear" placeholder="Year / class">
          <select id="filterRadar"><option value="">Any radar</option>${teamOptions}</select>
          <select id="filterStatus"><option value="">Any status</option><option value="active">Active</option><option value="monitoring">Monitoring</option><option value="closed">Closed</option></select>
          <input id="filterLead" placeholder="Lead">
          <input id="filterLatestAfter" type="date" title="Activity after">
          <input id="filterLatestBefore" type="date" title="Activity before">
          <button class="button" id="applyBuilderFilter">Apply</button>
        </div>
        <div id="advancedFilters" class="toolbar advanced-toolbar ${isAdvanced ? '' : 'hidden'}">
          <input id="studentFilter" class="filter-input" value="${escapeHtml(state.route.filter)}" placeholder="Advanced filter, e.g. radar==safeguarding;latestActivity>=2026-01-01">
          <select id="studentSavedFilter"><option value="">Saved filters</option>${savedOptions}</select>
          <button class="button" id="applyStudentFilter">Apply</button>
          <button class="button secondary" id="saveStudentFilter">Save view</button>
        </div>
        <div class="filter-switch">
          <div class="chip-row" id="studentFilterChips">${renderFilterChips(state.route.filter)}</div>
          <div class="filter-mode-actions">
            ${savedOptions ? `<select id="builderSavedFilter" class="saved-filter-select"><option value="">Saved filters</option>${savedOptions}</select>` : ''}
            <label class="check-control"><input id="filterOpenFollowUp" type="checkbox"> Open follow-up</label>
            <button class="text-button" id="clearStudentFilters">Clear</button>
          </div>
        </div>
        </div>
      </section>
      <section class="panel compact-panel student-table-panel">
        <div id="studentTable" class="table-scroll">${skeletonRows(10)}</div>
      </section>
    `;

    const toggle = document.getElementById('newStudentToggle');
    const newStudentForm = document.getElementById('newStudentForm');
    if (toggle) toggle.onclick = () => {
      newStudentForm.classList.remove('hidden');
      toggle.classList.add('hidden');
      const dirSearch = document.getElementById('directorySearch');
      if (dirSearch) dirSearch.focus();
      // Load directory on first open — fetch all students from DB
      if (!state.directoryCache) {
        document.getElementById('directoryResults').innerHTML = '<p class="muted small" style="padding:8px 12px">Loading…</p>';
        callServer({ path: '/api/students', method: 'get', query: { q: '', filter: '' } }).then((data) => {
          state.directoryCache = (data.students || []).map((s) => ({
            studentCode: s.student_code,
            firstName: s.first_name,
            lastName: s.last_name,
            id: s.id,
          }));
          document.getElementById('directoryResults').innerHTML = '';
        }).catch(() => showMessage('Could not load student directory.', 'error'));
      }
    };
    const cancelNewStudent = document.getElementById('cancelNewStudent');
    if (cancelNewStudent) cancelNewStudent.onclick = () => {
      newStudentForm.classList.add('hidden');
      if (toggle) toggle.classList.remove('hidden');
      document.getElementById('directoryResults').innerHTML = '';
      document.getElementById('directorySearch').value = '';
    };
    const dirSearch = document.getElementById('directorySearch');
    if (dirSearch) dirSearch.oninput = () => {
      const q = dirSearch.value.trim().toLowerCase();
      const results = document.getElementById('directoryResults');
      if (!q) { results.innerHTML = ''; return; }
      const dir = state.directoryCache || [];
      if (!dir.length) { results.innerHTML = '<p class="muted small" style="padding:8px 12px">Directory still loading…</p>'; return; }
      const matches = dir.filter((s) =>
        (s.firstName + ' ' + s.lastName).toLowerCase().includes(q) || s.studentCode.toLowerCase().includes(q)
      ).slice(0, 8);
      if (!matches.length) { results.innerHTML = '<p class="muted small" style="padding:8px 12px">No students found matching that name or ID.</p>'; return; }
      results.innerHTML = matches.map((s) => `
        <div class="directory-result" data-student-id="${escapeHtml(s.id || '')}" data-student-code="${escapeHtml(s.studentCode)}" data-first="${escapeHtml(s.firstName)}" data-last="${escapeHtml(s.lastName)}"
          style="padding:8px 12px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--border);transition:background 0.1s">
          <span>
            <strong>${escapeHtml(s.firstName)} ${escapeHtml(s.lastName)}</strong>
            <span class="muted small" style="margin-left:8px">${escapeHtml(s.studentCode)}</span>
          </span>
          <span class="badge" style="background:var(--sage);color:#fff;border-radius:6px;padding:2px 10px;font-size:12px">Select</span>
        </div>`).join('');
      results.querySelectorAll('.directory-result').forEach((row) => {
        row.onmouseenter = () => row.style.background = 'var(--surface-raised, #f5f5f5)';
        row.onmouseleave = () => row.style.background = '';
        row.onclick = () => {
          const studentId = row.dataset.studentId;
          if (studentId) {
            newStudentForm.classList.add('hidden');
            if (toggle) toggle.classList.remove('hidden');
            document.getElementById('directorySearch').value = '';
            document.getElementById('directoryResults').innerHTML = '';
            updateRoute({ page: 'student-profile', studentId });
          } else {
            callServer({ path: '/api/students', method: 'post', payload: { studentCode: row.dataset.studentCode, firstName: row.dataset.first, lastName: row.dataset.last } })
              .then((result) => {
                newStudentForm.classList.add('hidden');
                if (toggle) toggle.classList.remove('hidden');
                updateRoute({ page: 'student-profile', studentId: result.student.id });
              });
          }
        };
      });
    };
    document.getElementById('builderModeButton').onclick = () => updateRoute({ page: 'students', filterMode: 'builder' });
    document.getElementById('advancedModeButton').onclick = () => updateRoute({ page: 'students', filterMode: 'advanced' });
    document.getElementById('applyBuilderFilter').onclick = () => {
      updateRoute({ page: 'students', q: document.getElementById('studentSearch').value, filter: buildStudentFilterFromBuilder(), filterMode: 'builder' });
    };
    document.getElementById('applyStudentFilter').onclick = () => {
      updateRoute({ page: 'students', q: state.route.q, filter: document.getElementById('studentFilter').value, filterMode: 'advanced' });
    };
    document.getElementById('studentSavedFilter').onchange = (event) => {
      document.getElementById('studentFilter').value = event.target.value;
    };
    document.getElementById('saveStudentFilter').onclick = () => {
      const name = window.prompt('Name this filter');
      if (!name) return;
      callServer({
        path: '/api/saved-filters',
        method: 'post',
        payload: { areaKey: 'students', name, filterExpression: document.getElementById('studentFilter').value },
      }).then(() => {
        showMessage('Filter saved.');
        bustCache('settings:reference');
        bootstrapApp();
      });
    };
    document.getElementById('clearStudentFilters').onclick = () => updateRoute({ page: 'students', q: '', filter: '', filterMode: 'builder' });
    const builderSaved = document.getElementById('builderSavedFilter');
    if (builderSaved) builderSaved.onchange = (event) => {
      if (event.target.value) updateRoute({ page: 'students', filter: event.target.value, filterMode: 'builder' });
    };

    const studentCacheKey = 'students:' + (state.route.q || '') + ':' + (state.route.filter || '');
    const cachedStudents = getCached(studentCacheKey);
    const guard = getRenderGuard();

    function paintStudents(data) {
      if (!guard()) return;
      setCached(studentCacheKey, data);
      const students = data.students || [];
      if (!students.length) {
        document.getElementById('studentTable').innerHTML = '<p class="muted">No students matched this view.</p>';
        return;
      }
      document.getElementById('studentTable').innerHTML = `
        <table class="data-table dense-table">
          <thead><tr><th>Name</th><th>Year/Class</th><th>Radars</th><th>Lead</th><th>Latest</th><th>Status</th></tr></thead>
          <tbody>
            ${students.map((student) => `
              <tr data-student-id="${student.id}">
                <td><strong>${escapeHtml(studentName(student))}</strong><br><span class="muted small">${escapeHtml(student.student_code)}</span></td>
                <td>${escapeHtml(student.year_group || '')}<br><span class="muted small">${escapeHtml(student.tutor_group || '')}</span></td>
                <td><div class="badge-row">${(student.radar || []).map(radarBadge).join('') || '<span class="muted small">None</span>'}</div></td>
                <td>${escapeHtml(student.lead_name || 'Unassigned')}</td>
                <td>${escapeHtml(formatDate(student.latest_activity_at, true))}</td>
                <td><span class="badge">${escapeHtml(student.current_status)}</span></td>
              </tr>`).join('')}
          </tbody>
        </table>`;
      Array.from(document.querySelectorAll('[data-student-id]')).forEach((row) => {
        row.onclick = () => updateRoute({ page: 'student-profile', studentId: row.dataset.studentId });
      });
    }

    if (cachedStudents) {
      paintStudents(cachedStudents);
      callServer({ path: '/api/students', method: 'get', query: { q: state.route.q, filter: state.route.filter } }).then(paintStudents).catch(() => {});
    } else {
      callServer({ path: '/api/students', method: 'get', query: { q: state.route.q, filter: state.route.filter } }).then(paintStudents);
    }
  }

  function buildReferenceOptions(areaKey, fieldKey, selectedValue) {
    const opts = (state.bootstrap.referenceOptions || []).filter((o) => o.area_key === areaKey && o.field_key === fieldKey && o.is_active !== false);
    return opts.map((o) => `<option value="${escapeHtml(o.option_key)}"${o.option_key === selectedValue ? ' selected' : ''}>${escapeHtml(o.label)}</option>`).join('');
  }
  function incidentTypeOptions(selected) { return buildReferenceOptions('concerns', 'incident_type', selected || ''); }
  function actionTakenOptions(selected) { return buildReferenceOptions('concerns', 'action_taken', selected || ''); }

  function profileActionForm(action, data) {
    const teams = (state.bootstrap.teams || []).map((team) => `<option value="${team.id}">${escapeHtml(team.name)}</option>`).join('');
    const studentId = state.route.studentId;
    const forms = {
      note: (() => {
        const openConcerns = (data && data.concerns || []).filter((c) => ['open','triage','escalated'].includes(c.status));
        const concernLinkSelect = openConcerns.length ? `
          <select id="noteConcernId" class="span-2">
            <option value="">Not linked to a concern</option>
            ${openConcerns.map((c) => `<option value="${escapeHtml(c.id)}">[${escapeHtml(c.severity)}] ${escapeHtml(c.title)}</option>`).join('')}
          </select>` : '';
        return `
        <div class="form-grid">
          <input id="noteSummary" class="span-2" placeholder="Short note summary">
          <textarea id="noteBody" class="span-2" rows="3" placeholder="Support note"></textarea>
          <select id="noteTeam"><option value="">All teams (everyone)</option>${teams}</select>
          ${concernLinkSelect}
          <button class="button" id="submitNote">Add note</button>
        </div>`;
      })(),
      meeting: `
        <div class="form-grid">
          <input id="meetingTitle" placeholder="Meeting title">
          <input id="meetingOccurredAt" type="datetime-local" value="${new Date().toISOString().slice(0,16)}">

  function postProfile(path, payload) {
    if (state.profileSaving) return;
    state.profileSaving = true;
    Array.from(document.querySelectorAll('[data-profile-action], #profileActionHost .button')).forEach((button) => {
      button.disabled = true;
    });
    callServer({ path, method: 'post', payload }).then(() => {
      showMessage('Saved.');
      bustCache('dashboard');
      state.activeProfileAction = '';
      document.getElementById('profileActionHost').innerHTML = '';
      Array.from(document.querySelectorAll('[data-profile-action]')).forEach((btn) => {
        btn.className = 'button secondary';
        btn.disabled = false;
      });
      return callServer({ path: '/api/students/' + encodeURIComponent(state.route.studentId), method: 'get' });
    }).then((data) => {
      if (!data) return;
      state.profileData = data;
      const timeline = document.querySelector('.timeline');
      if (timeline) timeline.innerHTML = buildTimeline(data);
      const radarRow = document.querySelector('.profile-heading .badge-row');
      if (radarRow) radarRow.innerHTML = (data.derivedRadar || []).filter((r) => ['active', 'monitoring'].includes(r.status)).map((r) => radarBadge({ teamKey: r.team_key, teamName: r.team_name })).join('') || '<span class="muted small">No active radar</span>';
      renderProfileTab(data);
    }).finally(() => {
      state.profileSaving = false;
    });
  }

  function sendCategoryLabel(cat) {
    return { none: 'No SEND', sen_support: 'SEN Support', ehcp: 'EHCP', assessed_no_need: 'Assessed — No Need' }[cat] || friendlyLabel(cat || 'none');
  }

  function concernStatusBadge(status) {
    const cls = { open: '', triage: 'warn', escalated: 'danger', resolved: '', closed: 'secondary' }[status] || '';
    return `<span class="badge ${cls}">${escapeHtml(friendlyLabel(status))}</span>`;
  }

  function buildTimeline(data) {
    const chronologyRefs = new Set((data.chronology || [])
      .map((item) => item.source_table && item.source_id ? item.source_table + ':' + item.source_id : '')
      .filter(Boolean));
    const includeEntity = (table, item) => !chronologyRefs.has(table + ':' + item.id);
    const items = []
      .concat((data.chronology || []).map((item) => ({ ...item, source: item.event_type || 'event' })))
      .concat((data.notes || []).filter((item) => includeEntity('notes', item)).map((item) => ({ ...item, source: 'note_added' })))
      .concat((data.meetings || []).filter((item) => includeEntity('meetings', item)).map((item) => ({ ...item, source: 'meeting_logged' })))
      .concat((data.concerns || []).filter((item) => includeEntity('concerns', item)).map((item) => ({ ...item, source: 'concern_logged' })))
      .concat((data.actions || []).filter((item) => includeEntity('actions', item)).map((item) => ({ ...item, source: 'follow_up_created' })))
      .sort((a, b) => new Date(b.occurred_at || b.created_at) - new Date(a.occurred_at || a.created_at));
    if (!items.length) return '<p class="muted">No visible timeline activity yet.</p>';
    return items.slice(0, 80).map((item) => {
      const extraLines = [];
      if (item.action_taken) extraLines.push(`<p class="muted small"><strong>Action:</strong> ${escapeHtml(item.action_taken)}</p>`);
      if (item.outcome) extraLines.push(`<p class="muted small"><strong>Outcome:</strong> ${escapeHtml(item.outcome)}</p>`);
      if (item.outcome_summary && !item.outcome) extraLines.push(`<p class="muted small"><strong>Outcome:</strong> ${escapeHtml(item.outcome_summary)}</p>`);
      if (item.referral_type && item.referral_type !== 'none') extraLines.push(`<p class="muted small"><strong>Referral:</strong> ${escapeHtml(item.referral_type.toUpperCase())}${item.referral_date ? ' — ' + escapeHtml(formatDate(item.referral_date, true)) : ''}</p>`);
      if (item.external_agency) extraLines.push(`<p class="muted small"><strong>Agency:</strong> ${escapeHtml(friendlyLabel(item.external_agency))}</p>`);
      if (item.next_step) extraLines.push(`<p class="muted small"><strong>Next:</strong> ${escapeHtml(item.next_step)}${item.next_step_due ? ' by ' + escapeHtml(formatDate(item.next_step_due, true)) : ''}${item.next_step_owner_name ? ' (' + escapeHtml(item.next_step_owner_name) + ')' : ''}</p>`);
      if (item.closed_at) extraLines.push(`<p class="muted small"><strong>Closed:</strong> ${escapeHtml(formatDate(item.closed_at, true))}${item.closed_by_name ? ' by ' + escapeHtml(item.closed_by_name) : ''}</p>`);
      return `
      <div class="timeline-item">
        <div class="timeline-head">
          <h4>${escapeHtml(item.title || friendlyLabel(item.source))}</h4>
          <span class="badge">${escapeHtml(friendlyLabel(item.source || 'event'))}</span>
        </div>
        <p>${escapeHtml(item.summary || 'Protected event')}</p>
        ${extraLines.join('')}
        <p class="muted small">${escapeHtml(item.team_name || 'School record')} | ${escapeHtml(friendlyVisibility(item.visibility || item.visibility_level || 'summary'))} | ${escapeHtml(formatDate(item.occurred_at || item.created_at))}</p>
      </div>`;
    }).join('');
  }

                <select class="concern-edit-severity" data-concern-id="${escapeHtml(c.id)}">
                  <option value="low"${c.severity === 'low' ? ' selected' : ''}>Low</option>
                  <option value="medium"${c.severity === 'medium' ? ' selected' : ''}>Medium</option>
                  <option value="high"${c.severity === 'high' ? ' selected' : ''}>High</option>
                </select>
                <select class="concern-edit-status" data-concern-id="${escapeHtml(c.id)}">
                  <option value="open"${c.status === 'open' ? ' selected' : ''}>Open</option>
                  <option value="triage"${c.status === 'triage' ? ' selected' : ''}>Triage</option>
                  <option value="escalated"${c.status === 'escalated' ? ' selected' : ''}>Escalated</option>
                </select>
                <textarea class="span-2 concern-edit-summary" rows="3" data-concern-id="${escapeHtml(c.id)}">${escapeHtml(c.summary || '')}</textarea>
                ${c.team_key === 'safeguarding' ? `
                <select class="concern-edit-referral-type" data-concern-id="${escapeHtml(c.id)}">
                  <option value="none"${(c.referral_type || 'none') === 'none' ? ' selected' : ''}>No referral made</option>
                  <option value="mash"${c.referral_type === 'mash' ? ' selected' : ''}>MASH referral</option>
                  <option value="lado"${c.referral_type === 'lado' ? ' selected' : ''}>LADO referral</option>
                  <option value="police"${c.referral_type === 'police' ? ' selected' : ''}>Police</option>
                  <option value="early_help"${c.referral_type === 'early_help' ? ' selected' : ''}>Early help</option>
                  <option value="camhs"${c.referral_type === 'camhs' ? ' selected' : ''}>CAMHS</option>
                  <option value="social_care"${c.referral_type === 'social_care' ? ' selected' : ''}>Social care</option>
                  <option value="other"${c.referral_type === 'other' ? ' selected' : ''}>Other</option>
                </select>
                <textarea class="span-2 concern-edit-referral-outcome" rows="2" placeholder="Referral outcome (optional)" data-concern-id="${escapeHtml(c.id)}">${escapeHtml(c.referral_outcome || '')}</textarea>` : ''}
                <select class="concern-edit-action-taken" data-concern-id="${escapeHtml(c.id)}">
                  ${actionTakenOptions(c.action_taken || '')}
                </select>
                <textarea class="span-2 concern-edit-action-note" rows="2" placeholder="Action notes (optional)" data-concern-id="${escapeHtml(c.id)}">${escapeHtml(c.action_note || '')}</textarea>
                <select class="concern-edit-incident-type" data-concern-id="${escapeHtml(c.id)}">
                  ${incidentTypeOptions(c.incident_type || '')}
                </select>
                <button class="button concern-edit-save" data-concern-id="${escapeHtml(c.id)}">Save</button>
                <button class="button secondary concern-edit-cancel" data-concern-id="${escapeHtml(c.id)}">Cancel</button>
              </div>
            </div>` : '';
          const bodyHtml = isExpanded ? `
            <div class="concern-card-body">
              ${isEditing ? editFormHtml : `
              <p>${escapeHtml(c.summary || 'No summary.')}</p>
              ${c.action_taken ? `<p class="muted small"><strong>Action taken:</strong> ${escapeHtml(referenceLabel('concerns', 'action_taken', c.action_taken))}</p>` : ''}
              ${c.action_note ? `<p class="muted small">${escapeHtml(c.action_note)}</p>` : ''}
              ${c.referral_type && c.referral_type !== 'none' ? `<p class="muted small"><strong>Referral:</strong> ${escapeHtml(c.referral_type.toUpperCase())}</p>` : ''}
              ${c.outcome_summary ? `<p class="muted small"><strong>Outcome:</strong> ${escapeHtml(c.outcome_summary)}</p>` : ''}
              ${c.closed_at ? `<p class="muted small"><strong>Closed:</strong> ${escapeHtml(formatDate(c.closed_at, true))}</p>` : ''}
              ${linkedFuHtml}
              ${linkedNotesHtml}`}
            </div>` : '';
          return `
            <div class="concern-card" data-concern-card-id="${escapeHtml(c.id)}">
              <div class="concern-card-header" data-toggle-concern="${escapeHtml(c.id)}">
                <strong>${escapeHtml(c.title)}</strong>
                ${c.team_name ? `<span class="badge">${escapeHtml(c.team_name)}</span>` : ''}
                <span class="badge ${c.severity === 'high' ? 'danger' : c.severity === 'medium' ? 'warn' : ''}">${escapeHtml(c.severity)}</span>
                ${concernStatusBadge(c.status)}
                <span class="muted small">${escapeHtml(formatDate(c.created_at, true))}</span>
                ${isOpen ? `<button class="button secondary concern-edit-toggle" data-concern-id="${escapeHtml(c.id)}" style="margin-left:auto">Edit</button>` : ''}
              </div>
              ${bodyHtml}
            </div>`;
        }).join('');
      }

      host.innerHTML = `<div id="concernCardsContainer">${renderConcernCards()}</div>`;

      function bindConcernCards() {
        host.querySelectorAll('[data-toggle-concern]').forEach((el) => {
          el.onclick = (e) => {
            if (e.target.closest('.concern-edit-toggle')) return;
            const id = el.dataset.toggleConcern;
            if (expandedConcerns.has(id)) expandedConcerns.delete(id);
            else expandedConcerns.add(id);
            document.getElementById('concernCardsContainer').innerHTML = renderConcernCards();
            bindConcernCards();
          };
        });
        host.querySelectorAll('.concern-edit-toggle').forEach((btn) => {
          btn.onclick = (e) => {
            e.stopPropagation();
            const id = btn.dataset.concernId;
            expandedConcerns.add(id);
            if (editingConcerns.has(id)) editingConcerns.delete(id);
            else editingConcerns.add(id);
            document.getElementById('concernCardsContainer').innerHTML = renderConcernCards();
            bindConcernCards();
          };
        });
        host.querySelectorAll('.concern-edit-cancel').forEach((btn) => {
          btn.onclick = () => {
            editingConcerns.delete(btn.dataset.concernId);
            document.getElementById('concernCardsContainer').innerHTML = renderConcernCards();
            bindConcernCards();
          };
        });
        host.querySelectorAll('.concern-edit-save').forEach((btn) => {
          btn.onclick = () => {
            const id = btn.dataset.concernId;
            const titleEl = host.querySelector(`.concern-edit-title[data-concern-id="${id}"]`);
            const severityEl = host.querySelector(`.concern-edit-severity[data-concern-id="${id}"]`);
            const statusEl = host.querySelector(`.concern-edit-status[data-concern-id="${id}"]`);
            const summaryEl = host.querySelector(`.concern-edit-summary[data-concern-id="${id}"]`);
            const referralTypeEl = host.querySelector(`.concern-edit-referral-type[data-concern-id="${id}"]`);
            const referralOutcomeEl = host.querySelector(`.concern-edit-referral-outcome[data-concern-id="${id}"]`);
            const incidentTypeEl = host.querySelector(`.concern-edit-incident-type[data-concern-id="${id}"]`);
            const actionTakenEl = host.querySelector(`.concern-edit-action-taken[data-concern-id="${id}"]`);
            const actionNoteEl = host.querySelector(`.concern-edit-action-note[data-concern-id="${id}"]`);
            postProfile('/api/concerns/' + encodeURIComponent(id) + '/update', {
              title: titleEl ? titleEl.value : '',
              severity: severityEl ? severityEl.value : '',
              status: statusEl ? statusEl.value : '',
              summary: summaryEl ? summaryEl.value : '',
              referralType: referralTypeEl ? referralTypeEl.value : null,
              referralOutcome: referralOutcomeEl ? referralOutcomeEl.value : null,
              incidentType: incidentTypeEl ? incidentTypeEl.value : null,
              actionTaken: actionTakenEl ? actionTakenEl.value : null,
              actionNote: actionNoteEl ? actionNoteEl.value : null,
            });
          };
        });
      }

      bindConcernCards();
      return;
    }

    if (tab === 'meetings') {
      const meetings = (data.meetings || []).slice().sort((a, b) => new Date(b.occurred_at) - new Date(a.occurred_at));
      host.innerHTML = `<div class="list compact-list">${meetings.map((m) => `
        <article class="list-row compact-row" style="cursor:default">
          <header>
            <div>
              <h4>${escapeHtml(m.title)}</h4>
              <p class="muted">${escapeHtml(m.team_name || 'No team')} | ${escapeHtml(formatDate(m.occurred_at, true))}</p>
            </div>
            <span class="badge blue">${escapeHtml(friendlyLabel(m.interaction_type))}</span>
          </header>
          <p>${escapeHtml(m.summary || '')}</p>
        </article>`).join('') || '<p class="muted">No meetings recorded.</p>'}</div>`;
      return;
    }

    if (tab === 'followups') {
      const openFu = (data.actions || []).filter((a) => ['open','in_progress'].includes(a.status));
      const closedFu = (data.actions || []).filter((a) => !['open','in_progress'].includes(a.status));
      function fuRow(a, highlighted) {
        return `
          <article class="list-row compact-row" style="cursor:default${highlighted ? ';border-left:3px solid var(--sage)' : ''}">
            <header>
              <div>
                <h4>${escapeHtml(a.title)}</h4>
                <p class="muted">${escapeHtml(a.team_name || 'No team')} | ${a.due_at ? 'Due ' + escapeHtml(formatDate(a.due_at, true)) : 'No due date'}</p>
              </div>
              <div style="display:flex;gap:4px;align-items:center">
                <span class="badge ${a.priority === 'high' ? 'danger' : a.priority === 'medium' ? 'warn' : ''}">${escapeHtml(a.priority || 'normal')}</span>
                <span class="badge">${escapeHtml(friendlyLabel(a.status))}</span>
              </div>
            </header>
          </article>`;
      }
      host.innerHTML = `
        <div class="list compact-list">
          ${openFu.map((a) => fuRow(a, true)).join('')}
          ${closedFu.map((a) => fuRow(a, false)).join('')}
          ${!openFu.length && !closedFu.length ? '<p class="muted">No follow-ups recorded.</p>' : ''}
        </div>`;
      return;
    }
  }

  function renderStudentProfilePage() {
    setPageTitle('Profile');
    const target = document.getElementById('studentProfilePage');
    if (!state.route.studentId) {
      target.innerHTML = '<section class="panel"><p class="muted">Choose a student from the directory.</p></section>';
      return;
    }
    target.innerHTML = '<section class="panel"><p class="muted">Loading profile...</p></section>';
    const profileGuard = getRenderGuard();
    callServer({ path: '/api/students/' + encodeURIComponent(state.route.studentId), method: 'get' }).then((data) => {
      if (!profileGuard()) { console.warn('profileGuard killed render, renderGeneration=', renderGeneration); return; }
      state.profileData = data;
      const student = data.profile;
      const openConcernCount = (data.concerns || []).filter((c) => ['open','triage','escalated'].includes(c.status)).length;
      const hasRecentMeetings = (data.meetings || []).length > 0;
      const hasOpenFollowUps = (data.actions || []).some((a) => ['open','in_progress'].includes(a.status));

      const actionButtons = [
        ['note', 'Add note', 'notes.create'],
        ['meeting', 'Log meeting', 'meetings.create'],
        ['concern', 'Open case', 'concerns.create'],
        ['closeconcern', 'Close case', 'concerns.close'],
        ['sendplan', 'SEND plan', 'send.manage'],
        ['followup', 'Add follow-up', 'actions.manage'],
        ['status', 'Update status', 'students.manage'],
      ].filter(([, , permission]) => hasPermission(permission));

      target.innerHTML = `
        <section class="profile-heading panel compact-panel">
          <div>
            <button class="text-button" id="backToStudents">Back to students</button>
            <h3>${escapeHtml(studentName(student))}</h3>
            <p class="muted">${escapeHtml(student.student_code)} | ${escapeHtml(student.year_group || 'No year')} | ${escapeHtml(student.tutor_group || student.form_group || 'No class')}</p>
          </div>
          <div class="badge-row">${(data.derivedRadar || []).filter((r) => ['active', 'monitoring'].includes(r.status)).map((r) => radarBadge({ teamKey: r.team_key, teamName: r.team_name })).join('') || '<span class="muted small">No active radar</span>'}</div>
          ${hasPermission('students.manage') ? `<button class="button secondary" id="deleteStudentBtn" style="margin-top:6px;align-self:flex-end;color:#c0392b;border-color:#c0392b">Delete student</button>` : ''}
        </section>
        <section class="profile-actions">
          ${actionButtons.map(([key, label]) => `<button class="button ${state.activeProfileAction === key ? '' : 'secondary'}" data-profile-action="${key}">${label}</button>`).join('')}
        </section>
        <div id="profileActionHost">${profileActionForm(state.activeProfileAction, data)}</div>
        <div class="profile-tabs-bar">
          <button data-profile-tab="overview" class="tab-btn${state.profileTab === 'overview' ? ' active' : ''}">Overview</button>
          <button data-profile-tab="concerns" class="tab-btn${state.profileTab === 'concerns' ? ' active' : ''}">
            Cases${openConcernCount > 0 ? ' <span class="tab-dot danger"></span>' : ''}
          </button>
          <button data-profile-tab="meetings" class="tab-btn${state.profileTab === 'meetings' ? ' active' : ''}">
            Meetings${hasRecentMeetings ? ' <span class="tab-dot"></span>' : ''}
          </button>
          <button data-profile-tab="followups" class="tab-btn${state.profileTab === 'followups' ? ' active' : ''}">
            Follow-ups${hasOpenFollowUps ? ' <span class="tab-dot warn"></span>' : ''}
          </button>
        </div>
        <div id="profileTabContent"></div>
      `;
      document.getElementById('backToStudents').onclick = () => updateRoute({ page: 'students', studentId: '' });
      const deleteStudentBtn = document.getElementById('deleteStudentBtn');
      if (deleteStudentBtn) {
        deleteStudentBtn.onclick = () => {
          const name = studentName(student);
          if (!confirm('Permanently delete ' + name + '? This cannot be undone.')) return;
          callServer({ path: '/api/students/' + student.id + '/delete', method: 'post', payload: {} })
            .then(() => { showMessage(name + ' deleted.'); updateRoute({ page: 'students', studentId: '' }); })
            .catch((e) => showMessage('Delete failed: ' + e.message, 'error'));
        };
      }
      Array.from(document.querySelectorAll('[data-profile-action]')).forEach((button) => {
        button.onclick = () => {
          state.activeProfileAction = state.activeProfileAction === button.dataset.profileAction ? '' : button.dataset.profileAction;
          Array.from(document.querySelectorAll('[data-profile-action]')).forEach((btn) => {
            btn.className = 'button ' + (state.activeProfileAction === btn.dataset.profileAction ? '' : 'secondary');
          });
          document.getElementById('profileActionHost').innerHTML = profileActionForm(state.activeProfileAction, state.profileData);
          bindProfileActionHandlers();
        };
      });
      Array.from(document.querySelectorAll('[data-profile-tab]')).forEach((btn) => {
        btn.onclick = () => {
          state.profileTab = btn.dataset.profileTab;
          Array.from(document.querySelectorAll('[data-profile-tab]')).forEach((b) => {
            b.className = 'tab-btn' + (state.profileTab === b.dataset.profileTab ? ' active' : '');
          });
          renderProfileTab(data);
        };
      });
      bindProfileActionHandlers();
      renderProfileTab(data);
    });
  }

  function renderMeetingsPage() {
    setPageTitle('Calendar');
    const target = document.getElementById('meetingsPage');
    target.innerHTML = `
      <section class="panel compact-panel">
        <div class="panel-header">
          <div>
            <p class="eyebrow">Follow-ups</p>
            <h3 class="section-title">Calendar</h3>
          </div>
          <div class="segmented">
            <button class="button ${state.route.view === 'calendar' ? '' : 'secondary'}" id="calendarView">Calendar</button>
            <button class="button ${state.route.view === 'list' ? '' : 'secondary'}" id="listView">List</button>
          </div>
        </div>
        <div class="toolbar">
          <input id="meetingSearchPage" class="search-input" value="${escapeHtml(state.route.q)}" placeholder="Search meetings or students">
          <input id="meetingFilterPage" class="filter-input" value="${escapeHtml(state.route.filter)}" placeholder="Filter calendar">
          <button class="button" id="applyMeetingFilter">Apply</button>
        </div>
        <div class="chip-row">${renderFilterChips(state.route.filter)}</div>
      </section>
      <section class="panel compact-panel" id="meetingViewHost">${skeletonRows(8)}</section>
    `;
    document.getElementById('calendarView').onclick = () => updateRoute({ page: 'meetings', view: 'calendar' });
    document.getElementById('listView').onclick = () => updateRoute({ page: 'meetings', view: 'list' });
    document.getElementById('applyMeetingFilter').onclick = () => updateRoute({ page: 'meetings', q: document.getElementById('meetingSearchPage').value, filter: document.getElementById('meetingFilterPage').value });

    const meetingGuard = getRenderGuard();
    callServer({ path: '/api/meetings', method: 'get', query: { q: state.route.q, filter: state.route.filter } }).then((data) => {
      if (!meetingGuard()) return;
      const meetings = data.meetings || [];
      const host = document.getElementById('meetingViewHost');
      if (!host) return;
      if (state.route.view === 'list') {
        host.innerHTML = `<div class="list compact-list">${meetings.map(renderMeetingRecord).join('') || '<p class="muted">No visible meetings.</p>'}</div>`;
        bindStudentLinks();
        return;
      }
      const grouped = {};
      meetings.forEach((meeting) => {
        const key = new Date(meeting.calendar_at || meeting.occurred_at).toISOString().slice(0, 10);
        grouped[key] = grouped[key] || [];
        grouped[key].push(meeting);
      });
      const days = Object.keys(grouped).sort().slice(0, 28);
      host.innerHTML = `
        <div class="calendar-grid">
          ${days.map((day) => `
            <article class="calendar-day">
              <h4>${escapeHtml(formatDate(day, true))}</h4>
              ${grouped[day].map((meeting) => `
                <button class="calendar-event" data-student-link="${meeting.student_id}">
                  <strong>${escapeHtml(meeting.title)}</strong>
                  <span>${escapeHtml(meeting.first_name)} ${escapeHtml(meeting.last_name)} | ${escapeHtml(friendlyLabel(meeting.item_status || meeting.interaction_type))}</span>
                </button>`).join('')}
            </article>`).join('') || '<p class="muted">No visible calendar items.</p>'}
        </div>`;
      bindStudentLinks();
    });
  }

  function renderMeetingRecord(item) {
    return `

          <div>
            <h4>${escapeHtml(item.title)}</h4>
            <p class="muted">${escapeHtml(item.first_name)} ${escapeHtml(item.last_name)} | ${escapeHtml(item.team_name || 'No team')} | ${escapeHtml(item.assigned_user_name || 'Unassigned')}</p>

  function bindStudentLinks() {
    Array.from(document.querySelectorAll('[data-student-link]')).forEach((node) => {
      node.onclick = () => updateRoute({ page: 'student-profile', studentId: node.dataset.studentLink });

  function renderSettingsPage() {
    setPageTitle('Settings');
    const target = document.getElementById('settingsPage');
    const tab = state.route.settingsTab || 'users';
    const tabs = [['users', 'Users'], ['roles', 'Roles'], ['teams', 'Teams'], ['visibility', 'Team Sharing'], ['dropdowns', 'Dropdowns'], ['filters', 'Saved Filters'], ['audit', 'Audit Log']];

    // Build the tab bar shell once — never destroy it so clicks always register.
    if (!target.dataset.built) {
      target.innerHTML = `
        <section class="panel compact-panel"><div class="tabs" id="settingsTabs"></div></section>
        <div id="settingsBody">${skeletonRows(8)}</div>`;
      const tabsEl = target.querySelector('#settingsTabs');
      tabs.forEach(([key, label]) => {
        const btn = document.createElement('button');
        btn.dataset.settingsTab = key;
        btn.textContent = label;
        btn.onclick = () => { state.route.settingsTab = key; state.visibilityEditMode = false; state.visibilityPending = {}; renderSettingsPage(); };
        tabsEl.appendChild(btn);
      });
      target.dataset.built = '1';
    }

    // Update active tab button immediately — no wait.
    Array.from(target.querySelectorAll('[data-settings-tab]')).forEach((btn) => {
      btn.className = 'button ' + (btn.dataset.settingsTab === tab ? '' : 'secondary');
    });

    const guard = getRenderGuard();

    function paintTab(data) {
      if (!guard()) return;
      const bodyByTab = {
        users: renderUsersSettings(data),
        'user-roles': renderUserRolesSettings(data),
        roles: renderRolesSettings(data),
        teams: renderTeamsSettings(data),
        visibility: renderVisibilitySettings(data, state.visibilityEditMode, state.visibilityPending),
        dropdowns: renderDropdownSettings(data),
        filters: renderSavedFiltersSettings(data),
        audit: '<article class="panel compact-panel"><div id="auditLogTable">' + skeletonRows(8) + '</div></article>',
      };
      document.getElementById('settingsBody').outerHTML = '<div id="settingsBody">' + (bodyByTab[tab] || '') + '</div>';
      bindSettingsForms();
      if (tab === 'audit') loadAuditLog();
    }

    const cachedRef = getCached('settings:reference');
    if (cachedRef) {
      // Paint immediately from cache, then silently refresh in background.
      paintTab(cachedRef);
      callServer({ path: '/api/settings/reference', method: 'get' }).then((data) => {
        setCached('settings:reference', data);
        paintTab(data);
      }).catch(() => {});
    } else {
      document.getElementById('settingsBody').innerHTML = skeletonRows(8);
      callServer({ path: '/api/settings/reference', method: 'get' }).then((data) => {
        setCached('settings:reference', data);
        paintTab(data);
      });
    }
  }

  function renderUsersSettings(data) {
    const teamOptions = (data.teams || []).map((t) => `<option value="${t.id}">${escapeHtml(t.name)}</option>`).join('');
    const roleOptions = (data.roles || []).map((r) => `<option value="${r.id}">${escapeHtml(r.name)}</option>`).join('');
    const userTeams = data.userTeams || [];
    const userRoles = data.userRoles || [];
    const rows = (data.users || []).map((u) => {
      const teams = userTeams.filter((ut) => ut.user_id === u.id).map((ut) => `<span class="chip">${escapeHtml(ut.team_name)}</span>`).join('') || '<span class="muted small">No teams</span>';
      const roles = userRoles.filter((ur) => ur.user_id === u.id).map((ur) => `<span class="chip">${escapeHtml(ur.role_name)}</span>`).join('') || '<span class="muted small">No roles</span>';
      return `<tr>
        <td><strong>${escapeHtml(u.display_name)}</strong><br><span class="muted small">${escapeHtml(u.email)}</span></td>
        <td>${teams}</td>
        <td>${roles}</td>
        <td><span class="badge ${u.is_active ? '' : 'secondary'}">${u.is_active ? 'Active' : 'Inactive'}</span></td>
        <td style="white-space:nowrap">
          <button class="text-button" data-edit-user
            data-id="${escapeHtml(u.id)}"
            data-email="${escapeHtml(u.email)}"
            data-name="${escapeHtml(u.display_name)}"
            data-active="${u.is_active}" style="margin-right:8px">Edit</button>
          <button class="text-button" data-delete-user
            data-id="${escapeHtml(u.id)}"
            data-email="${escapeHtml(u.email)}"
            style="color:#c0392b">Delete</button>
        </td>
      </tr>`;
    }).join('');
    return `
      <article class="panel compact-panel">
        <div class="panel-header">
          <div><h3 class="section-title">Users</h3></div>
          <button class="button secondary" id="addUserToggle">+ Add user</button>
        </div>
        <div id="userForm" class="inline-form hidden" style="margin-bottom:10px">
          <div class="form-grid">
            <input id="userEmail" placeholder="user@school.org">
            <input id="userDisplayName" placeholder="Display name">
            <select id="userPrimaryTeam"><option value="">No primary team</option>${teamOptions}</select>
            <select id="userActive"><option value="true">Active</option><option value="false">Inactive</option></select>
            <p class="eyebrow span-2" style="margin:0">Teams</p>
            <select id="userTeams" class="span-2" multiple size="4">${teamOptions}</select>
            <p class="eyebrow span-2" style="margin:0">Roles</p>
            <select id="userRoles" class="span-2" multiple size="4">${roleOptions}</select>
            <button class="button" id="saveUserButton">Save</button>
            <button class="button secondary" id="cancelUserButton">Cancel</button>
          </div>

  function renderVisibilitySettings(data, editMode, pendingChanges) {
    const CONTENT_TYPES_META = [
      { key: 'concerns', label: 'Cases' },
      { key: 'meetings', label: 'Meetings' },
      { key: 'actions', label: 'Follow-ups' },
      { key: 'chronology', label: 'Chronology' },
      { key: 'radar', label: 'Radar' },
    ];
    const LEVEL_LABELS = { none: '–', summary: 'Title', full: 'Full' };
    const VISIBILITY_LEVELS = ['none', 'summary', 'full'];
    const teams = (data.teams || []).filter((t) => t.is_active !== false);
    const ruleMap = {};
    (data.visibilityRules || []).forEach((r) => {
      ruleMap[r.source_team_id + '|' + r.target_team_id + '|' + r.content_type] = { id: r.id, level: r.visibility_level };
    });
    // pending overrides stored as "srcId|tgtId|ct" -> new level string
    const pending = pendingChanges || {};

    const rows = [];
    teams.forEach((src) => {
      rows.push(`<tr style="background:var(--surface-alt,var(--surface))">
        <td colspan="${teams.length + 1}" style="padding:10px 12px 4px">
          <strong>${escapeHtml(src.name)}</strong>
          <span class="muted small" style="margin-left:8px">their data is visible to →</span>
        </td>
      </tr>`);
      CONTENT_TYPES_META.forEach((ct) => {
        const cells = teams.map((tgt) => {
          if (src.id === tgt.id) return `<td style="text-align:center;color:var(--sage);font-size:11px">always</td>`;
          const pKey = src.id + '|' + tgt.id + '|' + ct.key;
          const rule = ruleMap[pKey];
          const savedLevel = rule ? rule.level : 'none';
          const displayLevel = pending[pKey] !== undefined ? pending[pKey] : savedLevel;
          const ruleId = rule ? rule.id : '';
          if (!editMode) {
            const color = displayLevel === 'full' ? 'var(--sage)' : displayLevel === 'summary' ? '#9b8ecf' : 'var(--text-muted)';
            return `<td style="text-align:center;padding:4px 6px;font-size:11px;color:${color}">${escapeHtml(LEVEL_LABELS[displayLevel] || '–')}</td>`;
          }
          const levelBtns = VISIBILITY_LEVELS.map((lv) => {
            const active = displayLevel === lv;
            const isPending = pending[pKey] !== undefined && pending[pKey] === lv && lv !== savedLevel;
            const color = lv === 'full' ? 'var(--sage)' : lv === 'summary' ? '#9b8ecf' : 'var(--border)';
            const borderStyle = isPending ? '2px dashed ' + color : '1px solid ' + (active ? color : 'var(--border)');
            return `<button class="vis-level-btn"
              data-pkey="${escapeHtml(pKey)}"
              data-source-id="${escapeHtml(src.id)}" data-target-id="${escapeHtml(tgt.id)}"
              data-content-type="${escapeHtml(ct.key)}" data-level="${escapeHtml(lv)}"
              data-rule-id="${escapeHtml(ruleId)}" data-saved-level="${escapeHtml(savedLevel)}"
              style="padding:2px 6px;font-size:10px;border-radius:4px;border:${borderStyle};background:${active ? color : 'transparent'};color:${active && lv !== 'none' ? '#fff' : 'var(--text-muted)'};cursor:pointer;margin:1px"
              title="${escapeHtml(lv)}">${escapeHtml(LEVEL_LABELS[lv])}</button>`;
          }).join('');
          return `<td style="text-align:center;padding:3px 6px">${levelBtns}</td>`;
        }).join('');
        rows.push(`<tr>
          <td style="padding:3px 12px 3px 24px;font-size:12px;color:var(--text-muted)">${escapeHtml(ct.label)}</td>
          ${cells}
        </tr>`);
      });
    });

    const headerCells = teams.map((t) => `<th style="text-align:center;min-width:110px;font-size:12px">${escapeHtml(t.name)}</th>`).join('');
    const pendingCount = Object.keys(pending).length;
    const actionBar = editMode
      ? `<div style="display:flex;gap:8px;align-items:center">
           ${pendingCount > 0 ? `<span class="muted small">${pendingCount} unsaved change${pendingCount !== 1 ? 's' : ''}</span>` : ''}
           <button class="button" id="visibilitySaveBtn">Save changes</button>
           <button class="button secondary" id="visibilityCancelBtn">Cancel</button>
         </div>`
      : `<button class="button secondary" id="visibilityEditBtn">Edit</button>`;
    return `
      <article class="panel compact-panel">
        <div class="panel-header">
          <div>
            <h3 class="section-title">Team Sharing</h3>
            <p class="muted small">${editMode ? 'Select a level for each content type. Changes are not saved until you click <strong>Save changes</strong>.' : 'Read-only. Click <strong>Edit</strong> to make changes.'}</p>
          </div>
          ${actionBar}
        </div>
        <div class="table-scroll">
          <table class="data-table dense-table">
            <thead><tr><th></th>${headerCells}</tr></thead>
            <tbody>${rows.join('')}</tbody>
          </table>
        </div>
      </article>`;
  }

              <input id="referenceSortOrder" type="number" value="100" placeholder="Sort order">
              <select id="referenceActive"><option value="true">Active</option><option value="false">Inactive</option></select>
              <input type="hidden" id="referenceEditId" value="">
              <button class="button span-2" id="saveReferenceOptionButton">Add</button>
              <button class="button secondary span-2 hidden" id="cancelReferenceEditButton">Cancel edit</button>
            </div>
          </div>
        </div>
      </article>`;

  function bindSettingsForms() {
    // Add user toggle
    const addUserToggle = document.getElementById('addUserToggle');
    const userForm = document.getElementById('userForm');
    const cancelUserButton = document.getElementById('cancelUserButton');
    if (addUserToggle) addUserToggle.onclick = () => { userForm.classList.remove('hidden'); addUserToggle.classList.add('hidden'); };
    if (cancelUserButton) cancelUserButton.onclick = () => { userForm.classList.add('hidden'); addUserToggle.classList.remove('hidden'); };
    const selectedValues = (id) => Array.from((document.getElementById(id) || { selectedOptions: [] }).selectedOptions).map((option) => option.value);
    const saveUserButton = document.getElementById('saveUserButton');
    if (saveUserButton) saveUserButton.onclick = () => callServer({ path: '/api/settings/users', method: 'post', payload: { email: document.getElementById('userEmail').value, displayName: document.getElementById('userDisplayName').value, primaryTeamId: document.getElementById('userPrimaryTeam').value, isActive: document.getElementById('userActive').value === 'true', teamIds: selectedValues('userTeams'), roleIds: selectedValues('userRoles') } }).then(() => { bustCache('settings:reference'); updateRoute({ page: 'settings', settingsTab: 'users' }); showMessage('User saved.'); });

    // Edit existing user
    const userEditPanel = document.getElementById('userEditPanel');
    const cancelEditUserButton = document.getElementById('cancelEditUserButton');
    if (cancelEditUserButton) cancelEditUserButton.onclick = () => userEditPanel.classList.add('hidden');
    const saveEditUserButton = document.getElementById('saveEditUserButton');
    const deleteUserButton = document.getElementById('deleteUserButton');
    if (saveEditUserButton) saveEditUserButton.onclick = () => {
      const userId = saveEditUserButton.dataset.userId;
      callServer({ path: '/api/settings/users', method: 'post', payload: { email: document.getElementById('editUserEmail').value, displayName: document.getElementById('editUserDisplayName').value, primaryTeamId: document.getElementById('editUserPrimaryTeam').value, isActive: document.getElementById('editUserActive').value === 'true', teamIds: selectedValues('editUserTeams'), roleIds: selectedValues('editUserRoles') } })
        .then(() => { bustCache('settings:reference'); updateRoute({ page: 'settings', settingsTab: 'users' }); showMessage('User updated.'); });
    };
    if (deleteUserButton) deleteUserButton.onclick = () => {
      const userId = deleteUserButton.dataset.userId;
      const email = document.getElementById('editUserEmail').value;
      if (!confirm('Delete access for ' + email + '?')) return;
      callServer({ path: '/api/settings/users/delete', method: 'post', payload: { userId } })
        .then(() => { bustCache('settings:reference'); renderSettingsPage(); showMessage('User deleted.'); });
    };
    Array.from(document.querySelectorAll('[data-delete-user]')).forEach((btn) => {
      btn.onclick = () => {
        const userId = btn.dataset.id;
        const email = btn.dataset.email;
        if (!confirm('Delete access for ' + email + '?')) return;
        callServer({ path: '/api/settings/users/delete', method: 'post', payload: { userId } })
          .then(() => { bustCache('settings:reference'); renderSettingsPage(); showMessage('User deleted.'); })
          .catch((e) => showMessage('Delete failed: ' + e.message, 'error'));
      };
    });

    // Edit user — populate panel
    Array.from(document.querySelectorAll('[data-edit-user]')).forEach((btn) => {
      btn.onclick = () => {
        const userId = btn.dataset.id;
        document.getElementById('editUserEmail').value = btn.dataset.email;
        document.getElementById('editUserDisplayName').value = btn.dataset.name;
        document.getElementById('editUserActive').value = btn.dataset.active === 'true' ? 'true' : 'false';
        document.getElementById('saveEditUserButton').dataset.userId = userId;
        document.getElementById('deleteUserButton').dataset.userId = userId;
        const cachedRef = getCached('settings:reference');
        const userTeams = (cachedRef && cachedRef.userTeams || []).filter((ut) => ut.user_id === userId).map((ut) => ut.team_id);
        const userRoles = (cachedRef && cachedRef.userRoles || []).filter((ur) => ur.user_id === userId).map((ur) => ur.role_id);
        const primaryTeamSel = document.getElementById('editUserPrimaryTeam');
        const user = (cachedRef && cachedRef.users || []).find((u) => u.id === userId);
        if (user && primaryTeamSel) primaryTeamSel.value = user.primary_team_id || '';
        Array.from(document.getElementById('editUserTeams').options).forEach((option) => { option.selected = userTeams.includes(option.value); });
        Array.from(document.getElementById('editUserRoles').options).forEach((option) => { option.selected = userRoles.includes(option.value); });
        userEditPanel.classList.remove('hidden');
        userEditPanel.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      };
    });
    const assignRoleButton = document.getElementById('assignRoleButton');
    if (assignRoleButton) assignRoleButton.onclick = () => callServer({ path: '/api/settings/user-roles', method: 'post', payload: { userId: document.getElementById('urUserId').value, roleId: document.getElementById('urRoleId').value, action: 'assign' } }).then(() => { bustCache('settings:reference'); updateRoute({ page: 'settings', settingsTab: 'user-roles' }); });
    const removeRoleButton = document.getElementById('removeRoleButton');
    if (removeRoleButton) removeRoleButton.onclick = () => callServer({ path: '/api/settings/user-roles', method: 'post', payload: { userId: document.getElementById('urUserId').value, roleId: document.getElementById('urRoleId').value, action: 'remove' } }).then(() => { bustCache('settings:reference'); updateRoute({ page: 'settings', settingsTab: 'user-roles' }); });
    const saveRoleButton = document.getElementById('saveRoleButton');
    if (saveRoleButton) saveRoleButton.onclick = () => callServer({ path: '/api/settings/roles', method: 'post', payload: { roleKey: document.getElementById('roleKey').value, name: document.getElementById('roleName').value, description: document.getElementById('roleDescription').value, permissionKeys: Array.from(document.getElementById('rolePermissions').selectedOptions).map((o) => o.value) } }).then(() => { bustCache('settings:reference'); showMessage('Role saved.'); });
    const saveTeamButton = document.getElementById('saveTeamButton');
    if (saveTeamButton) saveTeamButton.onclick = () => callServer({ path: '/api/settings/teams', method: 'post', payload: { teamKey: document.getElementById('teamKey').value, name: document.getElementById('teamName').value, description: document.getElementById('teamDescription').value, accentColor: document.getElementById('teamAccentColor').value, isActive: document.getElementById('teamActive').value === 'true' } }).then(() => { bustCache('settings:reference'); showMessage('Team saved.'); });
    // Visibility matrix — Edit/Save/Cancel
    const visibilityEditBtn = document.getElementById('visibilityEditBtn');
    if (visibilityEditBtn) visibilityEditBtn.onclick = () => {
      state.visibilityEditMode = true;
      state.visibilityPending = {};
      renderSettingsPage();
    };
    const visibilityCancelBtn = document.getElementById('visibilityCancelBtn');
    if (visibilityCancelBtn) visibilityCancelBtn.onclick = () => {
      state.visibilityEditMode = false;
      state.visibilityPending = {};
      renderSettingsPage();
    };
    const visibilitySaveBtn = document.getElementById('visibilitySaveBtn');
    if (visibilitySaveBtn) visibilitySaveBtn.onclick = () => {
      const pending = state.visibilityPending;
      const cachedRef = getCached('settings:reference');
      const ruleMap = {};
      ((cachedRef && cachedRef.visibilityRules) || []).forEach((r) => {
        ruleMap[r.source_team_id + '|' + r.target_team_id + '|' + r.content_type] = { id: r.id, level: r.visibility_level };
      });
      // Run sequentially — google.script.run does not support parallel calls reliably
      const entries = Object.entries(pending);
      function runNext(i) {
        if (i >= entries.length) {
          state.visibilityEditMode = false;
          state.visibilityPending = {};
          bustCache('settings:reference');
          renderSettingsPage();
          showMessage('Team sharing saved.');
          return;
        }
        const [pKey, newLevel] = entries[i];
        const [sourceId, targetId, contentType] = pKey.split('|');
        const existing = ruleMap[pKey];
        const next = () => runNext(i + 1);
        const fail = (e) => showMessage('Save failed: ' + e.message, 'error');
        if (newLevel === 'none' && existing) {
          // Only delete if there's an existing rule to remove
          callServer({ path: '/api/settings/visibility-rules/delete', method: 'post', payload: { visibilityRuleId: existing.id } }).then(next).catch(fail);
        } else if (newLevel !== 'none') {
          // Upsert — worker clears deleted_at if rule was previously soft-deleted
          callServer({ path: '/api/settings/visibility-rules', method: 'post', payload: { sourceTeamId: sourceId, targetTeamId: targetId, contentType, visibilityLevel: newLevel } }).then(next).catch(fail);
        } else {
          next();
        }
      }
      runNext(0);
    };
    // In edit mode, clicking a level button updates pending state only
    Array.from(document.querySelectorAll('.vis-level-btn')).forEach((btn) => {
      btn.onclick = () => {
        const { pkey, level, savedLevel } = btn.dataset;
        if (level === savedLevel) {
          delete state.visibilityPending[pkey]; // revert to saved
        } else {
          state.visibilityPending[pkey] = level;
        }
        // Re-render just the matrix body without a server call
        const cachedRef = getCached('settings:reference');
        if (cachedRef) {
          const newHtml = renderVisibilitySettings(cachedRef, true, state.visibilityPending);
          const body = document.getElementById('settingsBody');
          if (body) { body.outerHTML = '<div id="settingsBody">' + newHtml + '</div>'; bindSettingsForms(); }
        }
      };
    });
    Array.from(document.querySelectorAll('[data-dropdown-field]')).forEach((btn) => {
      btn.onclick = () => {
        state.dropdownSettingsField = btn.dataset.dropdownField;
        renderSettingsPage();
      };
    });
    // Edit reference option — populate form
    Array.from(document.querySelectorAll('[data-edit-reference-option]')).forEach((btn) => {
      btn.onclick = () => {
        document.getElementById('referenceLabel').value = btn.dataset.label;
        document.getElementById('referenceSortOrder').value = btn.dataset.sort;
        document.getElementById('referenceActive').value = btn.dataset.active;
        document.getElementById('referenceEditId').value = btn.dataset.id;
        document.getElementById('referenceFormTitle').textContent = 'Edit option';
        document.getElementById('saveReferenceOptionButton').textContent = 'Save changes';
        document.getElementById('cancelReferenceEditButton').classList.remove('hidden');
        document.getElementById('referenceLabel').focus();
      };
    });
    const cancelReferenceEditButton = document.getElementById('cancelReferenceEditButton');
    if (cancelReferenceEditButton) cancelReferenceEditButton.onclick = () => {
      document.getElementById('referenceEditId').value = '';
      document.getElementById('referenceLabel').value = '';
      document.getElementById('referenceSortOrder').value = '100';
      document.getElementById('referenceActive').value = 'true';
      document.getElementById('referenceFormTitle').textContent = 'Add option';
      document.getElementById('saveReferenceOptionButton').textContent = 'Add';
      cancelReferenceEditButton.classList.add('hidden');
    };
    const saveReferenceOptionButton = document.getElementById('saveReferenceOptionButton');
    if (saveReferenceOptionButton) saveReferenceOptionButton.onclick = () => {
      const fieldKey = state.dropdownSettingsField || 'incident_type';
      const label = (document.getElementById('referenceLabel').value || '').trim();
      if (!label) return showMessage('Label is required.', 'error');
      const editId = document.getElementById('referenceEditId').value;
      const optionKey = editId ? undefined : label.toLowerCase().replace(/[^a-z0-9]+/g, '_');
      const payload = { areaKey: 'concerns', fieldKey, label, sortOrder: document.getElementById('referenceSortOrder').value, isActive: document.getElementById('referenceActive').value === 'true' };
      if (editId) payload.referenceOptionId = editId;
      else payload.optionKey = optionKey;
      callServer({ path: '/api/settings/reference-options', method: 'post', payload })
        .then(() => { bustCache('settings:reference'); renderSettingsPage(); showMessage(editId ? 'Option updated.' : 'Option added.'); });
    };
    Array.from(document.querySelectorAll('[data-delete-reference-option]')).forEach((btn) => {
      btn.onclick = () => {
        if (!confirm('Delete dropdown option: ' + btn.dataset.label + '?')) return;
        callServer({ path: '/api/settings/reference-options/delete', method: 'post', payload: { referenceOptionId: btn.dataset.id } })
          .then(() => { bustCache('settings:reference'); renderSettingsPage(); showMessage('Dropdown option deleted.'); });
      };
    });
  }

  function loadAuditLog() {
    callServer({ path: '/api/audit-logs', method: 'get' }).then((data) => {
      document.getElementById('auditLogTable').innerHTML = `<div class="table-scroll"><table class="data-table dense-table"><thead><tr><th>When</th><th>Actor</th><th>Area</th><th>Action</th><th>Student</th></tr></thead><tbody>${(data.auditLogs || []).map((entry) => `<tr><td>${escapeHtml(formatDate(entry.created_at))}</td><td>${escapeHtml(entry.actor_name || 'Automated')}</td><td>${escapeHtml(friendlyLabel(entry.area_key))}</td><td>${escapeHtml(friendlyLabel(entry.action_key))}</td><td>${entry.student_code ? escapeHtml(entry.student_code + ' | ' + entry.first_name + ' ' + entry.last_name) : ''}</td></tr>`).join('')}</tbody></table></div>`;
    });
  }

  function renderRoute() {
    showMessage('');
    ['dashboardPage', 'studentsPage', 'studentProfilePage', 'meetingsPage', 'settingsPage'].forEach((id) => document.getElementById(id).classList.add('hidden'));
    renderNav();
    const page = state.route.page;
    if (page === 'dashboard') {
      document.getElementById('dashboardPage').classList.remove('hidden');
      renderDashboard();
    } else if (page === 'students') {
      document.getElementById('studentsPage').classList.remove('hidden');
      renderStudentsPage();
    } else if (page === 'student-profile') {
      document.getElementById('studentProfilePage').classList.remove('hidden');
      renderStudentProfilePage();
    } else if (page === 'meetings') {
      document.getElementById('meetingsPage').classList.remove('hidden');
      renderMeetingsPage();
    } else if (page === 'settings') {
      document.getElementById('settingsPage').classList.remove('hidden');
      renderSettingsPage();
    } else {
      updateRoute({ page: 'dashboard', studentId: '', settingsTab: '' });
    }
  }

  function bootstrapApp() {
    parseRoute();
    google.script.run
      .withSuccessHandler((data) => {
        state.bootstrap = data;
        document.getElementById('currentUserPill').textContent = data.currentUser.displayName + ' | ' + data.currentUser.email;
        renderRoute();
      })
      .withFailureHandler((error) => {
        setStatus('Error');
        showMessage('Unable to load the app. Please try again or contact support.', 'error');
      })
      .getBootstrapData();
  }

  window.addEventListener('popstate', () => { parseRoute(); renderRoute(); });

  bootstrapApp();
</script>
