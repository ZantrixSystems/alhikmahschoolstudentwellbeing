<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="worker-url" content="">
  <title>Al Hikmah Student Wellbeing</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200;300;400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <style>
:root {
    --bg: #f7f8fb;
    --bg-wash: #eef2f6;
    --surface: #fbfcfd;
    --surface-low: #f3f6f8;
    --surface-mid: #e9eef2;
    --surface-high: #ffffff;
    --ink: #1b1c19;
    --muted: #6b6658;
    --soft: #9b927d;
    --gold: #6c5a16;
    --gold-bright: #c5a53a;
    --gold-soft: #eee6ca;
    --sage: #456a63;
    --rose: #8d4a44;
    --blue: #415ba4;
    --line: rgba(35, 49, 64, 0.10);
    --line-soft: rgba(99, 114, 132, 0.22);
    --shadow: 0 18px 36px -8px rgba(27, 28, 25, 0.08);
    --shadow-soft: 0 30px 60px -22px rgba(27, 28, 25, 0.10);
    --radius-xl: 20px;
    --radius-lg: 16px;
    --radius-md: 12px;
    --radius-sm: 8px;
    --font-body: "Manrope", sans-serif;
    --font-display: "Manrope", sans-serif;
  }

  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    min-height: 100%;
    background: linear-gradient(180deg, #f8fafc 0%, #eef2f6 100%);
    color: var(--ink);
    font-family: var(--font-body);
  }

  body { padding: 10px; }
  .hidden { display: none !important; }
  .small { font-size: 12px; }
  .muted { color: var(--muted); }
  .eyebrow {
    margin: 0 0 8px;
    text-transform: uppercase;
    letter-spacing: 0;
    font-size: 10px;
    font-weight: 800;
    color: var(--gold);
  }

  .app-shell {
    display: grid;
    grid-template-columns: 204px minmax(0, 1fr);
    grid-template-rows: auto minmax(0, 1fr);
    grid-template-areas:
      "masthead masthead"
      "sidebar main";
    min-height: calc(100vh - 20px);
    gap: 8px;
  }

  .masthead, .sidebar, .topbar, .card, .panel, .list-row, .message-banner {
    backdrop-filter: blur(20px);
    background: rgba(251, 249, 244, 0.82);
    border: 1px solid rgba(208, 197, 175, 0.22);
    box-shadow: var(--shadow);
  }

  .masthead {
    grid-area: masthead;
    min-height: 46px;
    border-radius: var(--radius-md);
    padding: 8px 14px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: rgba(251, 249, 244, 0.84);
  }
  .masthead-brand { display: flex; align-items: center; gap: 16px; }
  .masthead-wordmark {
    font-size: 16px;
    font-weight: 800;
    color: var(--gold);
    letter-spacing: 0;
  }
  .masthead-tools { display: flex; align-items: center; gap: 12px; }

  .sidebar {
    grid-area: sidebar;
    border-radius: var(--radius-md);
    padding: 12px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    background: linear-gradient(180deg, rgba(245,243,238,0.94) 0%, rgba(242,239,232,0.92) 100%);
  }
  .sidebar-heading h1, .topbar h2, .section-title {
    margin: 0;
    font-family: var(--font-display);
    font-weight: 800;
    letter-spacing: 0;
  }
  .sidebar-heading h1 { font-size: 22px; line-height: 1.05; max-width: 180px; }
  .sidebar-heading .muted { line-height: 1.35; max-width: 220px; margin: 8px 0 0; }

  .nav { display: grid; gap: 6px; }
  .nav-button {
    width: 100%;
    text-align: left;
    border: 0;
    border-radius: 10px;
    padding: 9px 10px;
    background: transparent;
    color: var(--ink);
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    transition: 160ms ease;
  }
  .nav-button.active, .nav-button:hover {
    background: var(--surface-high);
    color: var(--gold);
    transform: translateX(2px);
    box-shadow: 0 8px 24px -14px rgba(27, 28, 25, 0.18);
  }
  .sidebar-cta { margin-top: auto; }
  .cta-card {
    background: linear-gradient(180deg, rgba(255,255,255,0.64) 0%, rgba(240,238,233,0.86) 100%);
    border-radius: 20px;
    padding: 14px;
  }

  .main-shell { grid-area: main; min-width: 0; display: grid; gap: 7px; align-content: start; }
  .topbar {
    min-height: 46px;
    border-radius: var(--radius-md);
    padding: 8px 14px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 16px;
    background: linear-gradient(180deg, rgba(251,249,244,0.94) 0%, rgba(245,243,238,0.88) 100%);
  }
  .topbar-actions { display: flex; align-items: center; gap: 12px; }
  .topbar h2 { font-size: 20px; line-height: 1.05; }
  .topbar-meta { display: flex; align-items: center; gap: 14px; color: var(--muted); }
  .meta-kicker {
    text-transform: uppercase;
    letter-spacing: 0;
    font-size: 10px;
    font-weight: 800;
  }
  .meta-divider {
    width: 48px;
    height: 1px;
    background: var(--line-soft);
  }

  .status-pill, .user-pill, .badge, .chip {
    border-radius: 999px;
    padding: 6px 10px;
    background: rgba(235, 226, 204, 0.85);
    color: var(--gold);
    font-size: 12px;
    font-weight: 700;
    border: 1px solid rgba(208, 197, 175, 0.28);
  }
  .message-banner {
    border-radius: 20px;
    padding: 14px 18px;
    background: rgba(255,255,255,0.7);
  }

  .page { display: grid; gap: 7px; align-content: start; }
  .grid-cards { display: grid; gap: 10px; grid-template-columns: repeat(4, minmax(0, 1fr)); }
  .card, .panel {
    border-radius: var(--radius-md);
    padding: 10px;
    background: linear-gradient(180deg, rgba(255,255,255,0.72) 0%, rgba(251,249,244,0.96) 100%);
  }
  .card-number {
    font-size: 24px;
    font-family: var(--font-display);
    margin: 0;
    font-weight: 300;
    letter-spacing: 0;
  }
  .user-pill { min-width: 190px; text-align: center; }
  .stack { display: grid; gap: 10px; }
  .two-col { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(320px, 0.8fr); gap: 10px; }
  .profile-layout { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 10px; align-items: start; }
  .profile-side { display: grid; gap: 10px; }
  .panel-header, .split-header { display: flex; justify-content: space-between; gap: 8px; align-items: center; margin-bottom: 6px; }
  .section-title { font-size: 15px; text-transform: none; letter-spacing: 0; }

  .toolbar {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    align-items: center;
  }
  .toolbar input, .toolbar select, .toolbar textarea, .form-grid input, .form-grid select, .form-grid textarea {
    width: 100%;
    border: 0;
    background: var(--surface-mid);
    border-radius: 10px;
    padding: 8px 10px;
    color: var(--ink);
    font: inherit;
    box-shadow: inset 0 1px 2px rgba(27, 28, 25, 0.03);
  }
  .toolbar input:focus, .toolbar select:focus, .toolbar textarea:focus, .form-grid input:focus, .form-grid select:focus, .form-grid textarea:focus {
    outline: none;
    box-shadow: inset 0 -2px 0 var(--gold-bright);
  }
  .toolbar input.filter-input { min-width: 280px; flex: 1 1 320px; }
  .toolbar input.search-input { min-width: 220px; flex: 1 1 220px; }
  .filter-row { display:flex; gap:8px; width:100%; }
  .filter-row input, .filter-row select { background:var(--surface-mid); border:0; border-radius:10px; padding:8px 10px; font:inherit; color:var(--ink); box-shadow:inset 0 1px 2px rgba(27,28,25,0.03); }
  .filter-row input:focus, .filter-row select:focus { outline:none; box-shadow:inset 0 -2px 0 var(--gold-bright); }

  .button {
    border: 0;
    border-radius: 10px;
    padding: 8px 11px;
    background: linear-gradient(135deg, var(--gold) 0%, var(--gold-bright) 100%);
    color: #fff;
    font: inherit;
    font-weight: 800;
    letter-spacing: 0.02em;
    cursor: pointer;
    box-shadow: 0 16px 30px -18px rgba(115, 92, 0, 0.48);
  }
  .button.secondary {
    background: rgba(240, 238, 233, 0.92);
    color: var(--ink);
    box-shadow: none;
  }

  .chip-row, .badge-row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .badge.warn { background: rgba(212, 175, 55, 0.18); color: var(--gold); border-color: rgba(212, 175, 55, 0.26); }
  .badge.danger { background: rgba(141, 74, 68, 0.12); color: var(--rose); border-color: rgba(141, 74, 68, 0.18); }
  .badge.blue { background: rgba(65, 91, 164, 0.10); color: var(--blue); border-color: rgba(65, 91, 164, 0.16); }

  .list {
    display: grid;
    gap: 6px;
  }
  .list-row {
    border-radius: 10px;
    padding: 7px 9px;
    display: grid;
    gap: 6px;
    cursor: pointer;
    background: linear-gradient(180deg, rgba(255,255,255,0.92) 0%, rgba(248,246,241,0.96) 100%);
    transition: transform 160ms ease, box-shadow 160ms ease, background 160ms ease;
  }
  .list-row:hover {
    transform: translateY(-1px);
    box-shadow: var(--shadow-soft);
  }
  .list-row header {
    display: flex;
    justify-content: space-between;
    gap: 16px;
    align-items: start;
  }
  .list-row h4, .list-row p { margin: 0; }
  .list-row h4 { font-size: 14px; letter-spacing: 0; }
  .meta-row {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    color: var(--muted);
    font-size: 13px;
  }

  .timeline {
    display: grid;
    gap: 6px;
  }
  .timeline-item {
    border-left: 2px solid rgba(208, 197, 175, 0.58);
    padding: 6px 0 6px 14px;
    position: relative;
  }
  .timeline-item::before {
    content: "";
    position: absolute;
    left: -6px;
    top: 11px;
    width: 10px;
    height: 10px;
    border-radius: 999px;
    background: var(--gold-bright);
    box-shadow: 0 0 0 3px rgba(235, 226, 204, 0.8);
  }
  .timeline-item h4, .timeline-item p { margin: 0; }

  .form-grid {
    display: grid;
    gap: 12px;
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
  .form-grid .span-2 { grid-column: 1 / -1; }

  table.data-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
  }
  .data-table th, .data-table td {
    text-align: left;
    padding: 6px 8px;
    border-bottom: 1px solid rgba(208, 197, 175, 0.24);
    vertical-align: top;
  }
  .data-table th { color: var(--muted); font-weight: 800; font-size: 11px; text-transform: uppercase; letter-spacing: 0; }

  .compact-panel { padding: 8px 10px; }
  .compact-metrics .metric-card { min-height: 68px; }
  .compact-row { padding: 6px 9px; }
  .compact-list { gap: 5px; }
  .dense-table tbody tr { cursor: pointer; }
  .dense-table tbody tr:hover { background: rgba(47, 107, 102, 0.06); }
  .filter-builder {
    display: grid;
    grid-template-columns: minmax(180px, 1.5fr) repeat(4, minmax(110px, 1fr)) minmax(120px, 0.8fr) auto;
    gap: 7px;
    align-items: center;
  }
  .filter-builder input, .filter-builder select {
    width: 100%;
    border: 0;
    background: var(--surface-mid);
    border-radius: 10px;
    padding: 8px 10px;
    color: var(--ink);
    font: inherit;
  }
  .check-control {
    display: flex;
    gap: 6px;
    align-items: center;
    color: var(--muted);
    font-size: 13px;
    white-space: nowrap;
  }
  .team-picker {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 6px 12px;
    padding: 8px 10px;
    background: var(--surface-mid);
    border-radius: 10px;
  }
  .team-picker-label {
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--muted);
    margin-right: 4px;
  }
  .team-picker .check-control { white-space: nowrap; }
  .advanced-toolbar { margin-top: 8px; }
  .student-filter-shell { display: grid; gap: 8px; }
  .filter-switch { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .filter-mode-actions, .table-actions { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .saved-filter-select {
    border: 0;
    background: var(--surface-mid);
    border-radius: 8px;
    padding: 4px 8px;
    color: var(--muted);
    font: inherit;
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
  }
  .table-scroll { overflow: auto; }
  .student-table-panel { padding-top: 8px; }
  .student-table-panel .data-table td { vertical-align: middle; }
  .inline-form, .inline-action-panel { margin: 10px 0; }
  .profile-heading {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
  }
  .profile-heading h3 { margin: 2px 0; font-size: 20px; }
  .profile-actions {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }
  .text-button {
    border: 0;
    background: transparent;
    color: var(--sage);
    padding: 0;
    font: inherit;
    font-weight: 800;
    cursor: pointer;
  }
  .radar-badge {
    border-radius: 999px;
    padding: 5px 9px;
    font-size: 11px;
    font-weight: 800;
    color: #ffffff;
    background: var(--sage);
  }
  .radar-safeguarding { background: #b91c1c; }
  .safeguarding-eyebrow { color: #b91c1c; }
  .radar-sendco, .radar-send, .radar-sen { background: #2563eb; }
  .radar-pastoral { background: #0f766e; }
  .radar-behaviour { background: #b45309; }
  .detail-list { display: grid; gap: 8px; margin: 10px 0 0; }
  .detail-list div { display: grid; grid-template-columns: 96px minmax(0, 1fr); gap: 8px; }
  .detail-list dt { color: var(--muted); font-size: 12px; }
  .detail-list dd { margin: 0; font-weight: 700; }
  .active-strip-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; }
  .active-strip-col { display: flex; flex-direction: column; gap: 6px; }
  .active-strip-col .eyebrow { margin-bottom: 2px; }
  .active-strip-item { padding: 7px 9px; border: 1px solid var(--line); border-radius: 10px; background: rgba(255,255,255,0.64); }
  .active-strip-row { display: flex; align-items: center; gap: 5px; flex-wrap: wrap; margin-bottom: 2px; }
  .active-strip-item p { margin: 0; }

  .mini-record {
    padding: 7px 9px;
    border: 1px solid var(--line);
    border-radius: 10px;
    background: rgba(255, 255, 255, 0.64);
  }
  .mini-record p { margin: 4px 0 0; }
  .timeline-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 6px;
  }
  .calendar-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
    gap: 8px;
  }
  .calendar-day {
    min-height: 80px;
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 6px 8px;
    background: rgba(255,255,255,0.7);
  }
  .calendar-day h4 { margin: 0 0 5px; font-size: 13px; }
  .calendar-event {
    width: 100%;
    display: grid;
    gap: 2px;
    text-align: left;
    border: 0;
    border-left: 3px solid var(--sage);
    border-radius: 7px;
    background: var(--surface-low);
    padding: 5px 7px;
    margin-bottom: 4px;
    color: var(--ink);
    cursor: pointer;
  }
  .calendar-event span { color: var(--muted); font-size: 12px; }
  .segmented { display: flex; gap: 6px; }
  .tabs { display: flex; gap: 6px; flex-wrap: wrap; }
  .skeleton-line, .skeleton-card, .skeleton-row {
    overflow: hidden;
    background: linear-gradient(90deg, rgba(233,238,242,0.72), rgba(255,255,255,0.88), rgba(233,238,242,0.72));
    background-size: 220% 100%;
    animation: skeletonPulse 1.3s ease-in-out infinite;
  }
  .skeleton-card { min-height: 78px; border-radius: var(--radius-md); border: 1px solid var(--line); }
  .skeleton-line { height: 12px; border-radius: 999px; }
  .skeleton-row { height: 34px; border-radius: 9px; }
  .skeleton-stack { display: grid; gap: 8px; }
  @keyframes skeletonPulse {
    0% { background-position: 0% 0; }
    100% { background-position: -220% 0; }
  }
  .headline-card {
    min-height: 220px;
    position: relative;
    overflow: hidden;
  }
  .headline-card::before {
    content: "";
    position: absolute;
    top: 0;
    right: 0;
    width: 88px;
    height: 88px;
    background: linear-gradient(135deg, rgba(212,175,55,0.18), rgba(212,175,55,0));
    clip-path: polygon(100% 0, 0 0, 100% 100%);
  }
  .headline-card p:last-child { max-width: 28ch; line-height: 1.65; }
  .metric-card {
    min-height: 78px;
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto;
    align-items: center;
    gap: 8px;
  }
  .metric-foot {
    display: flex;
    align-items: center;
    gap: 8px;
    color: var(--muted);
    font-size: 13px;
  }
  .metric-dot {
    width: 8px;
    height: 8px;
    border-radius: 999px;
    background: var(--gold-bright);
  }
  code {
    font-family: var(--font-body);
    background: rgba(240, 238, 233, 0.92);
    padding: 3px 8px;
    border-radius: 999px;
    color: var(--gold);
    font-size: 12px;
    font-weight: 700;
  }

  .profile-tabs-bar { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
  .tab-btn { padding: 6px 14px; border-radius: 20px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; font-size: 0.85rem; display: inline-flex; align-items: center; gap: 5px; }
  .tab-btn.active { background: var(--ink); color: #fff; border-color: var(--ink); }
  .tab-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--sage); display: inline-block; }
  .tab-dot.danger { background: #b91c1c; }
  .tab-dot.warn { background: #b45309; }
  .concern-card { border: 1px solid var(--line); border-radius: 12px; background: var(--surface-high); margin-bottom: 6px; overflow: hidden; }
  .concern-card-header { padding: 9px 12px; cursor: pointer; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .concern-card-header strong { flex: 1; }
  .concern-card-body { padding: 10px 12px; border-top: 1px solid var(--line); background: var(--surface-low); }
  .concern-linked-followups { margin-top: 8px; }
  .concern-inline-form { margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--line-soft); }

  @media (max-width: 1180px) {
    .grid-cards { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .profile-layout, .two-col, .app-shell {
      grid-template-columns: 1fr;
      grid-template-areas:
        "masthead"
        "main"
        "sidebar";
    }
    .filter-builder { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  }

  @media (max-width: 720px) {
    body { padding: 10px 10px 80px; }
    .masthead-brand { display: grid; gap: 10px; }
    .grid-cards, .form-grid, .filter-builder { grid-template-columns: 1fr; }
    .topbar { padding: 10px 12px; }
    .sidebar, .card, .panel { padding: 12px; }
    .topbar h2 { font-size: 20px; }
    .sidebar { display: none; }
    .app-shell {
      grid-template-columns: 1fr;
      grid-template-areas: "masthead" "main";
    }
  }

  /* ── Mobile bottom navigation ── */
  .bottom-nav {
    display: none;
  }
  @media (max-width: 720px) {
    .bottom-nav {
      display: flex;
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 62px;
      background: rgba(251, 249, 244, 0.96);
      backdrop-filter: blur(20px);
      border-top: 1px solid rgba(208, 197, 175, 0.35);
      box-shadow: 0 -4px 20px -6px rgba(27, 28, 25, 0.12);
      z-index: 200;
      padding: 0 4px;
      align-items: stretch;
    }
    .bottom-nav-btn {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      border: 0;
      background: transparent;
      color: var(--ink-muted);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.02em;
      text-transform: uppercase;
      cursor: pointer;
      border-radius: 12px;
      margin: 6px 2px;
      transition: 140ms ease;
      padding: 0 4px;
    }
    .bottom-nav-btn svg {
      width: 22px;
      height: 22px;
      stroke-width: 2;
      flex-shrink: 0;
    }
    .bottom-nav-btn.active {
      color: var(--gold);
      background: rgba(197, 165, 58, 0.10);
    }
    .bottom-nav-btn:active { opacity: 0.7; }
  }

  /* ── More menu overlay ── */
  .more-menu-overlay {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 300;
  }
  .more-menu-overlay.open { display: block; }
  .more-menu-backdrop {
    position: absolute;
    inset: 0;
    background: rgba(15, 17, 23, 0.35);
  }

<body>

  <div id="appContainer" style="display:none">

      <main class="main-shell">

        <section id="appMessage" class="message-banner hidden"></section>
    
        <section id="dashboardPage" class="page"></section>

  </div>

  <!-- Mobile bottom navigation bar -->
  <nav class="bottom-nav" id="bottomNav" aria-label="Main navigation">
    <button class="bottom-nav-btn" data-nav-key="dashboard" onclick="mobileNav('dashboard')" aria-label="Dashboard">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
      Dashboard

    <button class="bottom-nav-btn" data-nav-key="students" onclick="mobileNav('students')" aria-label="Students">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path stroke-linecap="round" stroke-linejoin="round" d="M23 21v-2a4 4 0 0 0-3-3.87"/><path stroke-linecap="round" stroke-linejoin="round" d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>

      More
    </button>

  <!-- More menu sheet -->
  <div class="more-menu-overlay" id="moreMenuOverlay">
    <div class="more-menu-backdrop" onclick="closeMoreMenu()"></div>
    <div class="more-menu-sheet" role="menu">
      <button class="more-menu-item" onclick="mobileNav('settings'); closeMoreMenu();" aria-label="Settings">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6z"/><path stroke-linecap="round" stroke-linejoin="round" d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        Settings
      </button>
      <button class="more-menu-item" id="moreMenuProfile" onclick="closeMoreMenu();" aria-label="Profile">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor"><circle cx="12" cy="8" r="4"/><path stroke-linecap="round" stroke-linejoin="round" d="M4 20c0-4 3.582-7 8-7s8 3 8 7"/></svg>
        <span id="moreMenuProfileLabel">My Account</span>
      </button>
      <button class="more-menu-item danger" onclick="signOut()" aria-label="Sign out">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h6a2 2 0 0 1 2 2v1"/></svg>
        Sign Out
      </button>
    </div>
  </div>

  <script>
    let idToken = null;

    function handleGoogleSignIn(response) {
      idToken = response.credential;
      document.getElementById('loginOverlay').style.display = 'none';
      document.getElementById('appContainer').style.display = '';
      bootstrapApp();
    }
    window.handleGoogleSignIn = handleGoogleSignIn;

    setInterval(() => {
      if (window.google && google.accounts && google.accounts.id) {
        google.accounts.id.prompt();
      }
    }, 45 * 60 * 1000);

const state = {
    bootstrap: null,
    route: {},
    activeProfileAction: '',
    profileData: null,
    profileSaving: false,
    profileTab: 'overview',
    dropdownSettingsField: 'incident_type',
    visibilityEditMode: false,
    visibilityPending: {},
    directoryCache: null,
    pageCache: {},
  };

  const PAGE_CACHE_TTL = 300000; // 5 minutes
  let renderGeneration = 0;

  function getCached(key) {
    const entry = state.pageCache[key];
    if (!entry) return null;
    if (Date.now() - entry.ts > PAGE_CACHE_TTL) { delete state.pageCache[key]; return null; }
    return entry.data;
  }

  function setCached(key, data) {
    state.pageCache[key] = { ts: Date.now(), data };
  }

  function bustCache(key) {
    delete state.pageCache[key];
  }

  // Returns a guard function. Call it before painting async results — if the
  // render generation has moved on (user navigated away), returns false.
  function getRenderGuard() {
    const gen = ++renderGeneration;
    return () => renderGeneration === gen;
  }

  function setStatus(text) {
    const el = document.getElementById('globalStatus');
    if (el) el.textContent = text;
  }

  function showMessage(text, mode) {
    const el = document.getElementById('appMessage');
    if (!text) {
      el.classList.add('hidden');
      el.textContent = '';
      return;
    }
    el.classList.remove('hidden');
    el.textContent = text;
    el.style.borderColor = mode === 'error' ? 'rgba(179,63,63,0.28)' : 'var(--line)';
  }

  function callServer(request) {
    setStatus('Loading');
    const base = document.querySelector('meta[name="worker-url"]')?.content || window.location.origin;
    const url = new URL(request.path, base);
    if (request.query) {
      Object.entries(request.query).forEach(([key, value]) => {
        if (value !== '' && value !== null && value !== undefined) url.searchParams.set(key, value);
      });
    }
    const method = (request.method || 'get').toUpperCase();
    return fetch(url.toString(), {
      method,
      headers: {
        'Content-Type': 'application/json',
        'Authorization': 'Bearer ' + idToken,
      },
      body: ['GET', 'HEAD'].includes(method) ? undefined : JSON.stringify(request.payload || {}),
    })
      .then((resp) => resp.json().then((result) => ({ resp, result })))
      .then(({ resp, result }) => {
        setStatus('');
        if (!resp.ok || !result.ok) {
          const message = (result.error && result.error.message) || 'Something went wrong.';
          showMessage(message, 'error');
          throw new Error(message);
        }
        return result.data;
      })
      .catch((error) => {
        setStatus('Error');
        const message = error && error.message ? String(error.message).replace(/^Error:\s*/, '') : '';
        showMessage(message || 'Something went wrong. Please try again or contact support.', 'error');
        throw error;
      });
  }

  const ROUTE_SESSION_KEY = 'ahw_route';

  function parseRoute() {
    let parsed = {};
    try {
      const raw = sessionStorage.getItem(ROUTE_SESSION_KEY);
      if (raw) parsed = JSON.parse(raw);
    } catch (e) { /* sessionStorage unavailable or corrupt */ }
    state.route = {
      page: parsed.page || 'dashboard',
      studentId: parsed.studentId || '',
      q: parsed.q || '',
      filter: parsed.filter || '',
      filterMode: parsed.filterMode || (parsed.filter ? 'advanced' : 'builder'),
      view: parsed.view || 'calendar',
      settingsTab: parsed.settingsTab || 'users',
    };
  }

  function updateRoute(next) {
    const current = Object.assign({}, state.route);
    Object.keys(next).forEach((key) => {
      if (next[key]) current[key] = next[key];
      else delete current[key];
    });
    try { sessionStorage.setItem(ROUTE_SESSION_KEY, JSON.stringify(current)); } catch (e) {}
    parseRoute();
    renderRoute();
  }

  function hasPermission(permission) {
    const keys = (state.bootstrap.currentUser && state.bootstrap.currentUser.permissionKeys) || [];
    return keys.includes('*') || keys.includes(permission);
  }

  function escapeHtml(value) {
    return String(value || '')
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  function formatDate(value, dateOnly) {
    if (!value || String(value).startsWith('1970-01-01')) return 'Not set';
    const options = dateOnly ? { dateStyle: 'medium' } : { dateStyle: 'medium', timeStyle: 'short' };
    return new Date(value).toLocaleString([], options);
  }

  function friendlyLabel(value) {
    return String(value || '')
      .replace(/[._-]+/g, ' ')
      .replace(/\b\w/g, (letter) => letter.toUpperCase());
  }

  function friendlyVisibility(value) {
    const labels = { none: 'Hidden', indicator: 'Limited', summary: 'Summary', full: 'Full' };
    return labels[value] || friendlyLabel(value);
  }

  function referenceLabel(areaKey, fieldKey, optionKey) {
    const opts = (state.bootstrap.referenceOptions || []).filter((option) => option.area_key === areaKey && option.field_key === fieldKey);
    const match = opts.find((option) => option.option_key === optionKey);
    return match ? match.label : friendlyLabel(optionKey);
  }

  function studentName(student) {
    return [student.preferred_name || student.first_name, student.last_name].filter(Boolean).join(' ');
  }

  function radarBadge(radar) {
    return `<span class="radar-badge radar-${escapeHtml(radar.teamKey || radar.team_key || 'general')}">${escapeHtml(radar.teamName || radar.team_name || 'Radar')}</span>`;
  }

  function renderFilterChips(expression) {
    if (!expression) return '<span class="muted small">No filters applied.</span>';
    return expression
      .split(/(?=[;,])/)
      .map((part) => part.replace(/^[;,]/, '').trim())
      .filter(Boolean)
      .map((part) => `<span class="chip">${escapeHtml(part)}</span>`)
      .join('');
  }

  function buildStudentFilterFromBuilder() {
    const parts = [];
    const year = document.getElementById('filterYear').value;
    const radar = document.getElementById('filterRadar').value;
    const status = document.getElementById('filterStatus').value;
    const lead = document.getElementById('filterLead').value;
    const latestAfter = document.getElementById('filterLatestAfter').value;
    const latestBefore = document.getElementById('filterLatestBefore').value;
    const openFollowUp = document.getElementById('filterOpenFollowUp').checked;
    if (year) parts.push('yearGroup==' + year);
    if (radar) parts.push('radar==' + radar);
    if (status) parts.push('status==' + status);
    if (lead) parts.push('lead~=' + lead.replace(/\s+/g, '_'));
    if (latestAfter) parts.push('latestActivity>=' + latestAfter);
    if (latestBefore) parts.push('latestActivity<=' + latestBefore);
    if (openFollowUp) parts.push('openFollowUp==true');
    return parts.join(';');
  }

  function renderNav() {
    const nav = document.getElementById('nav');
    // Build nav once; on subsequent calls just update active class without recreating buttons.
    if (!nav.dataset.built) {
      nav.innerHTML = '';
      (state.bootstrap.navigation || []).forEach((item) => {
        const button = document.createElement('button');
        button.className = 'nav-button';
        button.textContent = item.label;
        button.dataset.navKey = item.key;
        button.onclick = () => updateRoute({ page: item.key, studentId: '', settingsTab: '', filter: '', q: '' });
        nav.appendChild(button);
      });
      nav.dataset.built = '1';
    }
    Array.from(nav.querySelectorAll('[data-nav-key]')).forEach((btn) => {
      const isActive = state.route.page === btn.dataset.navKey || (btn.dataset.navKey === 'students' && state.route.page === 'student-profile');
      btn.className = 'nav-button' + (isActive ? ' active' : '');
    });
    syncBottomNav();
  }

  function setPageTitle(text) {
    document.getElementById('pageTitle').textContent = text;
  }

  function skeletonCards(count) {
    return Array.from({ length: count }, () => '<article class="skeleton-card"></article>').join('');
  }

  function skeletonRows(count) {
    return `<div class="skeleton-stack">${Array.from({ length: count }, () => '<div class="skeleton-row"></div>').join('')}</div>`;
  }

  function renderDashboard() {
    setPageTitle('Dashboard');
    const target = document.getElementById('dashboardPage');
    const showSafeguardingPanel = hasPermission('concerns.review');
    target.innerHTML = `
      <section class="grid-cards compact-metrics" id="headlineCards">${skeletonCards(4)}</section>
      <section class="two-col">
        <article class="panel">
          <div class="panel-header">
            <div>
              <p class="eyebrow">Radars</p>
              <h3 class="section-title">Team Load</h3>
            </div>
          </div>
          <div id="teamLoadList" class="list compact-list">${skeletonRows(4)}</div>
        </article>
        <article class="panel">
          <div class="panel-header">
            <div>
              <p class="eyebrow">Upcoming</p>
              <h3 class="section-title">My Follow-ups</h3>
            </div>
          </div>
          <div id="dashboardUpcoming" class="list compact-list">${skeletonRows(4)}</div>
        </article>
      </section>
      ${showSafeguardingPanel ? `
      <section class="panel compact-panel">
        <div class="panel-header">
          <div>
            <p class="eyebrow safeguarding-eyebrow">Safeguarding</p>
            <h3 class="section-title">Open Concerns</h3>
          </div>
        </div>
        <div id="dslConcernList" class="list compact-list">${skeletonRows(4)}</div>
      </section>` : ''}
    `;

    const guard = getRenderGuard();
    const cached = getCached('dashboard');

    function paintDashboard(data) {
      if (!guard()) return;
      setCached('dashboard', data);
      const headline = data.headline || {};
      document.getElementById('headlineCards').innerHTML = [
        ['Students', headline.student_count || 0],
        ['Open Concerns', headline.open_concern_count || 0],
        ['Active Radars', headline.active_radar_count || 0],
        ['My Open Follow-ups', headline.open_action_count || 0],
      ].map(([label, value]) => `
        <article class="card metric-card">
          <p class="eyebrow">${escapeHtml(label)}</p>
          <div class="card-number">${escapeHtml(value)}</div>
        </article>`).join('');

      document.getElementById('teamLoadList').innerHTML = (data.teamLoad || []).map((team) => `
        <article class="list-row compact-row" style="cursor:default">
          <header>
            <div>
              <h4>${escapeHtml(team.name)}</h4>
              <p class="muted">${escapeHtml(team.team_key)}</p>
            </div>
            <span class="badge blue">${escapeHtml(team.active_students)} active</span>
          </header>
        </article>`).join('');

      document.getElementById('dashboardUpcoming').innerHTML =
        (data.upcomingFollowUps || []).map(renderMeetingRecord).join('') || '<p class="muted">No open follow-ups assigned to you.</p>';
      bindStudentLinks();

      const dslList = document.getElementById('dslConcernList');
      if (dslList) {
        const concerns = data.openSafeguardingConcerns || [];
        dslList.innerHTML = concerns.map((c) => `
          <article class="list-row compact-row" data-student-link="${c.student_id}">
            <header>
              <div>
                <h4>${escapeHtml(c.title)}</h4>
                <p class="muted">${escapeHtml(c.first_name)} ${escapeHtml(c.last_name)} | ${escapeHtml(c.student_code)} | Y${escapeHtml(c.year_group || '?')}</p>
              </div>
              <div style="display:flex;gap:4px;align-items:center">
                ${concernStatusBadge(c.status)}
                <span class="badge ${c.severity === 'high' ? 'danger' : c.severity === 'medium' ? 'warn' : ''}">${escapeHtml(c.severity)}</span>
              </div>
            </header>
            ${c.referral_type && c.referral_type !== 'none' ? `<p class="muted small">Referral: ${escapeHtml(c.referral_type.toUpperCase())}</p>` : ''}
            <p class="muted small">${escapeHtml(c.submitted_by_name || 'Unknown')} | ${escapeHtml(c.team_name || 'No team')} | ${escapeHtml(formatDate(c.updated_at, true))}</p>
          </article>`).join('') || '<p class="muted">No open safeguarding concerns.</p>';
        bindStudentLinks();
      }
    }

    if (cached) {
      paintDashboard(cached);
      const cacheAge = Date.now() - (state.pageCache['dashboard'] || {}).ts;
      if (cacheAge > 60000) callServer({ path: '/api/dashboard', method: 'get' }).then(paintDashboard).catch(() => {});
    } else {
      callServer({ path: '/api/dashboard', method: 'get' }).then((data) => {
        paintDashboard(data);
        // Pre-warm student list so navigating to Students is instant
        if (!getCached('students::')) {
          callServer({ path: '/api/students', method: 'get', query: { q: '', filter: '' } })
            .then((sd) => setCached('students::', sd)).catch(() => {});
        }
      });
    }
  }

  function renderStudentsPage() {
    setPageTitle('Students');
    const target = document.getElementById('studentsPage');
    const savedOptions = (state.bootstrap.savedFilters || [])
      .filter((entry) => entry.area_key === 'students')
      .map((entry) => `<option value="${escapeHtml(entry.filter_expression)}">${escapeHtml(entry.name)}</option>`)
      .join('');
    const teamOptions = (state.bootstrap.teams || [])
      .map((team) => `<option value="${escapeHtml(team.team_key)}">${escapeHtml(team.name)}</option>`)
      .join('');
    const isAdvanced = state.route.filterMode === 'advanced';

    target.innerHTML = `
      <section class="panel compact-panel">
        <div class="panel-header">
          <div>
            <p class="eyebrow">Directory</p>
            <h3 class="section-title">Students</h3>
          </div>
          <div class="table-actions">
            <div class="segmented">
              <button class="button ${!isAdvanced ? '' : 'secondary'}" id="builderModeButton">Builder</button>
              <button class="button ${isAdvanced ? '' : 'secondary'}" id="advancedModeButton">Advanced</button>
            </div>
          </div>
        </div>
        <div class="student-filter-shell">
        <div id="builderFilters" class="filter-builder ${isAdvanced ? 'hidden' : ''}">
          <input id="studentSearch" class="search-input" value="${escapeHtml(state.route.q)}" placeholder="Search name or code">
          <input id="filterYear" placeholder="Year / class">
          <select id="filterRadar"><option value="">Any radar</option>${teamOptions}</select>
          <select id="filterStatus"><option value="">Any status</option><option value="active">Active</option><option value="inactive">Inactive</option></select>
          <input id="filterLead" placeholder="Lead">
          <input id="filterLatestAfter" type="date" title="Activity after">
          <input id="filterLatestBefore" type="date" title="Activity before">
          <button class="button" id="applyBuilderFilter">Apply</button>
        </div>
        <div id="advancedFilters" class="toolbar advanced-toolbar ${isAdvanced ? '' : 'hidden'}">
          <input id="studentFilter" class="filter-input" value="${escapeHtml(state.route.filter)}" placeholder="Advanced filter, e.g. radar==safeguarding;latestActivity>=2026-01-01">
          <select id="studentSavedFilter"><option value="">Saved filters</option>${savedOptions}</select>
          <button class="button" id="applyStudentFilter">Apply</button>
          <button class="button secondary" id="saveStudentFilter">Save view</button>
        </div>
        <div class="filter-switch">
          <div class="chip-row" id="studentFilterChips">${renderFilterChips(state.route.filter)}</div>
          <div class="filter-mode-actions">
            ${savedOptions ? `<select id="builderSavedFilter" class="saved-filter-select"><option value="">Saved filters</option>${savedOptions}</select>` : ''}
            <label class="check-control"><input id="filterOpenFollowUp" type="checkbox"> Open follow-up</label>
            <button class="text-button" id="clearStudentFilters">Clear</button>
          </div>
        </div>

      if (!guard()) return;
      setCached(studentCacheKey, data);
      const students = data.students || [];

        document.getElementById('studentTable').innerHTML = '<p class="muted">No students matched this view.</p>';
        return;

        row.onclick = () => updateRoute({ page: 'student-profile', studentId: row.dataset.studentId });

    if (cachedStudents) {
      paintStudents(cachedStudents);
      callServer({ path: '/api/students', method: 'get', query: { q: state.route.q, filter: state.route.filter } }).then(paintStudents).catch(() => {});

  function postProfile(path, payload) {
    if (state.profileSaving) return;
    state.profileSaving = true;
    Array.from(document.querySelectorAll('[data-profile-action], #profileActionHost .button')).forEach((button) => {
      button.disabled = true;
    });
    callServer({ path, method: 'post', payload }).then(() => {
      showMessage('Saved.');
      bustCache('dashboard');
      state.activeProfileAction = '';
      document.getElementById('profileActionHost').innerHTML = '';
      Array.from(document.querySelectorAll('[data-profile-action]')).forEach((btn) => {
        btn.className = 'button secondary';
        btn.disabled = false;
      });
      return callServer({ path: '/api/students/' + encodeURIComponent(state.route.studentId), method: 'get' });
    }).then((data) => {
      if (!data) return;
      state.profileData = data;
      const timeline = document.querySelector('.timeline');
      if (timeline) timeline.innerHTML = buildTimeline(data);
      const radarRow = document.querySelector('.profile-heading .badge-row');
      if (radarRow) radarRow.innerHTML = (data.derivedRadar || []).filter((r) => ['active', 'monitoring'].includes(r.status)).map((r) => radarBadge({ teamKey: r.team_key, teamName: r.team_name })).join('') || '<span class="muted small">No active radar</span>';
      renderProfileTab(data);
    }).finally(() => {
      state.profileSaving = false;
    });
  }

  function concernStatusBadge(status) {
    const cls = { open: '', triage: 'warn', escalated: 'danger', resolved: '', closed: 'secondary' }[status] || '';
    return `<span class="badge ${cls}">${escapeHtml(friendlyLabel(status))}</span>`;
  }

  function buildTimeline(data) {
    const chronologyRefs = new Set((data.chronology || [])
      .map((item) => item.source_table && item.source_id ? item.source_table + ':' + item.source_id : '')
      .filter(Boolean));
    const includeEntity = (table, item) => !chronologyRefs.has(table + ':' + item.id);
    const items = []
      .concat((data.chronology || []).map((item) => ({ ...item, source: item.event_type || 'event' })))
      .concat((data.notes || []).filter((item) => includeEntity('notes', item)).map((item) => ({ ...item, source: 'note_added' })))
      .concat((data.meetings || []).filter((item) => includeEntity('meetings', item)).map((item) => ({ ...item, source: 'meeting_logged' })))
      .concat((data.concerns || []).filter((item) => includeEntity('concerns', item)).map((item) => ({ ...item, source: 'concern_logged' })))
      .concat((data.actions || []).filter((item) => includeEntity('actions', item)).map((item) => ({ ...item, source: 'follow_up_created' })))
      .sort((a, b) => new Date(b.occurred_at || b.created_at) - new Date(a.occurred_at || a.created_at));
    if (!items.length) return '<p class="muted">No visible timeline activity yet.</p>';
    return items.slice(0, 80).map((item) => {
      const extraLines = [];
      if (item.action_taken) extraLines.push(`<p class="muted small"><strong>Action:</strong> ${escapeHtml(item.action_taken)}</p>`);
      if (item.outcome) extraLines.push(`<p class="muted small"><strong>Outcome:</strong> ${escapeHtml(item.outcome)}</p>`);
      if (item.outcome_summary && !item.outcome) extraLines.push(`<p class="muted small"><strong>Outcome:</strong> ${escapeHtml(item.outcome_summary)}</p>`);
      if (item.referral_type && item.referral_type !== 'none') extraLines.push(`<p class="muted small"><strong>Referral:</strong> ${escapeHtml(item.referral_type.toUpperCase())}${item.referral_date ? ' — ' + escapeHtml(formatDate(item.referral_date, true)) : ''}</p>`);
      if (item.external_agency) extraLines.push(`<p class="muted small"><strong>Agency:</strong> ${escapeHtml(friendlyLabel(item.external_agency))}</p>`);
      if (item.next_step) extraLines.push(`<p class="muted small"><strong>Next:</strong> ${escapeHtml(item.next_step)}${item.next_step_due ? ' by ' + escapeHtml(formatDate(item.next_step_due, true)) : ''}${item.next_step_owner_name ? ' (' + escapeHtml(item.next_step_owner_name) + ')' : ''}</p>`);
      if (item.closed_at) extraLines.push(`<p class="muted small"><strong>Closed:</strong> ${escapeHtml(formatDate(item.closed_at, true))}${item.closed_by_name ? ' by ' + escapeHtml(item.closed_by_name) : ''}</p>`);
      return `
      <div class="timeline-item">
        <div class="timeline-head">
          <h4>${escapeHtml(item.title || friendlyLabel(item.source))}</h4>
          <span class="badge">${escapeHtml(friendlyLabel(item.source || 'event'))}</span>
        </div>
        <p>${escapeHtml(item.summary || 'Protected event')}</p>
        ${extraLines.join('')}
        <p class="muted small">${escapeHtml(item.team_name || 'School record')} | ${escapeHtml(friendlyVisibility(item.visibility || item.visibility_level || 'summary'))} | ${escapeHtml(formatDate(item.occurred_at || item.created_at))}</p>
      </div>`;
    }).join('');
  }

          ${plan.plan_ref ? `<div><dt>Ref</dt><dd>${escapeHtml(plan.plan_ref)}</dd></div>` : ''}
          <div><dt>Status</dt><dd>${escapeHtml(reviewLabel)}</dd></div>
          ${plan.review_date ? `<div><dt>Review</dt><dd>${escapeHtml(formatDate(plan.review_date, true))}</dd></div>` : ''}
          ${plan.ehcp_annual_review_date ? `<div><dt>EHCP review</dt><dd>${escapeHtml(formatDate(plan.ehcp_annual_review_date, true))}</dd></div>` : ''}
          ${plan.external_agency ? `<div><dt>Agency</dt><dd>${escapeHtml(plan.external_agency)}</dd></div>` : ''}
          ${plan.specialist_name ? `<div><dt>Specialist</dt><dd>${escapeHtml(plan.specialist_name)}</dd></div>` : ''}
        </dl>
        ${plan.identified_needs ? `<p class="muted small" style="margin-top:6px"><strong>Needs:</strong> ${escapeHtml(plan.identified_needs)}</p>` : ''}
        ${plan.planned_provision ? `<p class="muted small"><strong>Provision:</strong> ${escapeHtml(plan.planned_provision)}</p>` : ''}
        ${plan.review_outcome ? `<p class="muted small"><strong>Last outcome:</strong> ${escapeHtml(plan.review_outcome)}</p>` : ''}
      </article>`;
  }

  function renderProfileTab(data) {
    const host = document.getElementById('profileTabContent');
    if (!host) return;
    const tab = state.profileTab;
    const student = data.profile;

    if (tab === 'overview') {
      host.innerHTML = `
        <section class="profile-layout">
          <main class="panel">
            <div class="panel-header">
              <div>
                <p class="eyebrow">Timeline</p>
                <h3 class="section-title">Activity</h3>
              </div>
            </div>
            <div class="timeline">${buildTimeline(data)}</div>
          </main>
          <aside class="profile-side">
            <article class="panel compact-panel">
              <p class="eyebrow">Student</p>
              <h3 class="section-title">${escapeHtml(studentName(student))}</h3>
              <dl class="detail-list">
                <div><dt>Year/Class</dt><dd>${escapeHtml(student.year_group || '')} ${escapeHtml(student.tutor_group || student.form_group || '')}</dd></div>
                <div><dt>Status</dt><dd>${escapeHtml(student.current_status)}</dd></div>
                <div><dt>SEND</dt><dd>${escapeHtml(sendCategoryLabel(student.send_category))}</dd></div>
                <div><dt>Created</dt><dd>${escapeHtml(formatDate(student.created_at, true))}</dd></div>
                <div><dt>Updated</dt><dd>${escapeHtml(formatDate(student.updated_at, true))}</dd></div>
              </dl>
            </article>
            ${renderSendPlanPanel(data.activeSendPlan)}
            <article class="panel compact-panel">
              <p class="eyebrow">Radar Details</p>
              <div class="list compact-list">
                ${(data.derivedRadar || []).map((r) => `
                  <article class="mini-record">
                    <div class="badge-row">${radarBadge({ teamKey: r.team_key, teamName: r.team_name })}<span class="badge ${r.severity === 'high' ? 'danger' : r.severity === 'medium' ? 'warn' : ''}">${escapeHtml(r.severity)}</span><span class="badge">${escapeHtml(r.status)}</span></div>
                    <p class="muted small">${escapeHtml(r.team_name)}</p>
                  </article>`).join('') || '<p class="muted">No visible radar records.</p>'}
              </div>
            </article>
          </aside>
        </section>`;
      return;
    }

    if (tab === 'concerns') {
      const expandedConcerns = new Set();
      const editingConcerns = new Set();
      const allConcerns = (data.concerns || []).slice().sort((a, b) => {
        const aOpen = ['open','triage','escalated'].includes(a.status) ? 0 : 1;
        const bOpen = ['open','triage','escalated'].includes(b.status) ? 0 : 1;
        return aOpen - bOpen || new Date(b.created_at) - new Date(a.created_at);
      });
      const studentId = state.route.studentId;

      function renderConcernCards() {
        return allConcerns.map((c) => {
          const isOpen = ['open','triage','escalated'].includes(c.status);
          const isExpanded = expandedConcerns.has(c.id);
          const isEditing = editingConcerns.has(c.id);
          const linkedFuHtml = (c.linkedFollowUps && c.linkedFollowUps.length) ? `
            <div class="concern-linked-followups">
              <p class="eyebrow" style="margin-bottom:4px">Linked Follow-ups</p>
              ${c.linkedFollowUps.map((fu) => `
                <div class="active-strip-item" style="margin-bottom:4px">
                  <div class="active-strip-row">
                    <span class="badge ${fu.priority === 'high' ? 'danger' : fu.priority === 'medium' ? 'warn' : ''}">${escapeHtml(fu.priority || 'normal')}</span>
                    <span class="badge">${escapeHtml(friendlyLabel(fu.status))}</span>
                    <strong>${escapeHtml(fu.title)}</strong>
                  </div>
                  <p class="muted small">${fu.due_at ? 'Due ' + escapeHtml(formatDate(fu.due_at, true)) : 'No due date'}</p>
                </div>`).join('')}
            </div>` : '';
          const linkedNotes = c.linkedNotes || [];
          const linkedNotesHtml = linkedNotes.length ? `
            <div class="concern-linked-followups">
              <p class="eyebrow" style="margin-bottom:4px">Notes</p>
              ${linkedNotes.map((n) => `
                <div class="active-strip-item" style="margin-bottom:4px">
                  <strong>${escapeHtml(n.summary || n.title)}</strong>
                  <p class="muted small">${escapeHtml(n.body || '')}${n.team_name ? ' | ' + escapeHtml(n.team_name) : ''} | ${escapeHtml(formatDate(n.created_at))}</p>
                </div>`).join('')}
            </div>` : '';
          const editFormHtml = isEditing ? `
            <div class="concern-edit-form" data-concern-edit-id="${escapeHtml(c.id)}">
              <p class="eyebrow" style="margin-bottom:6px">Edit concern</p>
              <div class="form-grid">
                <input class="span-2 concern-edit-title" data-concern-id="${escapeHtml(c.id)}" value="${escapeHtml(c.title)}">
                <select class="concern-edit-severity" data-concern-id="${escapeHtml(c.id)}">
                  <option value="low"${c.severity === 'low' ? ' selected' : ''}>Low</option>
                  <option value="medium"${c.severity === 'medium' ? ' selected' : ''}>Medium</option>
                  <option value="high"${c.severity === 'high' ? ' selected' : ''}>High</option>
                </select>
                <select class="concern-edit-status" data-concern-id="${escapeHtml(c.id)}">
                  <option value="open"${c.status === 'open' ? ' selected' : ''}>Open</option>
                  <option value="triage"${c.status === 'triage' ? ' selected' : ''}>Triage</option>
                  <option value="escalated"${c.status === 'escalated' ? ' selected' : ''}>Escalated</option>
                </select>
                <textarea class="span-2 concern-edit-summary" rows="3" data-concern-id="${escapeHtml(c.id)}">${escapeHtml(c.summary || '')}</textarea>
                ${c.team_key === 'safeguarding' ? `
                <select class="concern-edit-referral-type" data-concern-id="${escapeHtml(c.id)}">
                  <option value="none"${(c.referral_type || 'none') === 'none' ? ' selected' : ''}>No referral made</option>
                  <option value="mash"${c.referral_type === 'mash' ? ' selected' : ''}>MASH referral</option>
                  <option value="lado"${c.referral_type === 'lado' ? ' selected' : ''}>LADO referral</option>
                  <option value="police"${c.referral_type === 'police' ? ' selected' : ''}>Police</option>
                  <option value="early_help"${c.referral_type === 'early_help' ? ' selected' : ''}>Early help</option>
                  <option value="camhs"${c.referral_type === 'camhs' ? ' selected' : ''}>CAMHS</option>
                  <option value="social_care"${c.referral_type === 'social_care' ? ' selected' : ''}>Social care</option>
                  <option value="other"${c.referral_type === 'other' ? ' selected' : ''}>Other</option>
                </select>
                <textarea class="span-2 concern-edit-referral-outcome" rows="2" placeholder="Referral outcome (optional)" data-concern-id="${escapeHtml(c.id)}">${escapeHtml(c.referral_outcome || '')}</textarea>` : ''}
                <select class="concern-edit-action-taken" data-concern-id="${escapeHtml(c.id)}">
                  ${actionTakenOptions(c.action_taken || '')}
                </select>
                <textarea class="span-2 concern-edit-action-note" rows="2" placeholder="Action notes (optional)" data-concern-id="${escapeHtml(c.id)}">${escapeHtml(c.action_note || '')}</textarea>
                <select class="concern-edit-incident-type" data-concern-id="${escapeHtml(c.id)}">
                  ${incidentTypeOptions(c.incident_type || '')}
                </select>
                <button class="button concern-edit-save" data-concern-id="${escapeHtml(c.id)}">Save</button>
                <button class="button secondary concern-edit-cancel" data-concern-id="${escapeHtml(c.id)}">Cancel</button>
              </div>
            </div>` : '';
          const bodyHtml = isExpanded ? `
            <div class="concern-card-body">
              ${isEditing ? editFormHtml : `
              <p>${escapeHtml(c.summary || 'No summary.')}</p>
              ${c.action_taken ? `<p class="muted small"><strong>Action taken:</strong> ${escapeHtml(referenceLabel('concerns', 'action_taken', c.action_taken))}</p>` : ''}
              ${c.action_note ? `<p class="muted small">${escapeHtml(c.action_note)}</p>` : ''}
              ${c.referral_type && c.referral_type !== 'none' ? `<p class="muted small"><strong>Referral:</strong> ${escapeHtml(c.referral_type.toUpperCase())}</p>` : ''}
              ${c.outcome_summary ? `<p class="muted small"><strong>Outcome:</strong> ${escapeHtml(c.outcome_summary)}</p>` : ''}
              ${c.closed_at ? `<p class="muted small"><strong>Closed:</strong> ${escapeHtml(formatDate(c.closed_at, true))}</p>` : ''}
              ${linkedFuHtml}
              ${linkedNotesHtml}`}
            </div>` : '';
          return `
            <div class="concern-card" data-concern-card-id="${escapeHtml(c.id)}">
              <div class="concern-card-header" data-toggle-concern="${escapeHtml(c.id)}">
                <strong>${escapeHtml(c.title)}</strong>
                ${c.team_name ? `<span class="badge">${escapeHtml(c.team_name)}</span>` : ''}
                <span class="badge ${c.severity === 'high' ? 'danger' : c.severity === 'medium' ? 'warn' : ''}">${escapeHtml(c.severity)}</span>
                ${concernStatusBadge(c.status)}
                <span class="muted small">${escapeHtml(formatDate(c.created_at, true))}</span>
                ${isOpen ? `<button class="button secondary concern-edit-toggle" data-concern-id="${escapeHtml(c.id)}" style="margin-left:auto">Edit</button>` : ''}
              </div>
              ${bodyHtml}
            </div>`;
        }).join('');
      }

      host.innerHTML = `<div id="concernCardsContainer">${renderConcernCards()}</div>`;

      function bindConcernCards() {
        host.querySelectorAll('[data-toggle-concern]').forEach((el) => {
          el.onclick = (e) => {
            if (e.target.closest('.concern-edit-toggle')) return;
            const id = el.dataset.toggleConcern;
            if (expandedConcerns.has(id)) expandedConcerns.delete(id);
            else expandedConcerns.add(id);
            document.getElementById('concernCardsContainer').innerHTML = renderConcernCards();
            bindConcernCards();
          };
        });
        host.querySelectorAll('.concern-edit-toggle').forEach((btn) => {
          btn.onclick = (e) => {
            e.stopPropagation();
            const id = btn.dataset.concernId;
            expandedConcerns.add(id);
            if (editingConcerns.has(id)) editingConcerns.delete(id);
            else editingConcerns.add(id);
            document.getElementById('concernCardsContainer').innerHTML = renderConcernCards();
            bindConcernCards();
          };
        });
        host.querySelectorAll('.concern-edit-cancel').forEach((btn) => {
          btn.onclick = () => {
            editingConcerns.delete(btn.dataset.concernId);
            document.getElementById('concernCardsContainer').innerHTML = renderConcernCards();
            bindConcernCards();
          };
        });
        host.querySelectorAll('.concern-edit-save').forEach((btn) => {
          btn.onclick = () => {
            const id = btn.dataset.concernId;
            const titleEl = host.querySelector(`.concern-edit-title[data-concern-id="${id}"]`);
            const severityEl = host.querySelector(`.concern-edit-severity[data-concern-id="${id}"]`);
            const statusEl = host.querySelector(`.concern-edit-status[data-concern-id="${id}"]`);
            const summaryEl = host.querySelector(`.concern-edit-summary[data-concern-id="${id}"]`);
            const referralTypeEl = host.querySelector(`.concern-edit-referral-type[data-concern-id="${id}"]`);
            const referralOutcomeEl = host.querySelector(`.concern-edit-referral-outcome[data-concern-id="${id}"]`);
            const incidentTypeEl = host.querySelector(`.concern-edit-incident-type[data-concern-id="${id}"]`);
            const actionTakenEl = host.querySelector(`.concern-edit-action-taken[data-concern-id="${id}"]`);
            const actionNoteEl = host.querySelector(`.concern-edit-action-note[data-concern-id="${id}"]`);
            postProfile('/api/concerns/' + encodeURIComponent(id) + '/update', {
              title: titleEl ? titleEl.value : '',
              severity: severityEl ? severityEl.value : '',
              status: statusEl ? statusEl.value : '',
              summary: summaryEl ? summaryEl.value : '',
              referralType: referralTypeEl ? referralTypeEl.value : null,
              referralOutcome: referralOutcomeEl ? referralOutcomeEl.value : null,
              incidentType: incidentTypeEl ? incidentTypeEl.value : null,
              actionTaken: actionTakenEl ? actionTakenEl.value : null,
              actionNote: actionNoteEl ? actionNoteEl.value : null,
            });
          };
        });
      }

      bindConcernCards();
      return;
    }

    if (tab === 'meetings') {
      const meetings = (data.meetings || []).slice().sort((a, b) => new Date(b.occurred_at) - new Date(a.occurred_at));
      host.innerHTML = `<div class="list compact-list">${meetings.map((m) => `
        <article class="list-row compact-row" style="cursor:default">
          <header>
            <div>
              <h4>${escapeHtml(m.title)}</h4>
              <p class="muted">${escapeHtml(m.team_name || 'No team')} | ${escapeHtml(formatDate(m.occurred_at, true))}</p>
            </div>
            <span class="badge blue">${escapeHtml(friendlyLabel(m.interaction_type))}</span>
          </header>
          <p>${escapeHtml(m.summary || '')}</p>
        </article>`).join('') || '<p class="muted">No meetings recorded.</p>'}</div>`;
      return;
    }

    if (tab === 'followups') {
      const openFu = (data.actions || []).filter((a) => ['open','in_progress'].includes(a.status));
      const closedFu = (data.actions || []).filter((a) => !['open','in_progress'].includes(a.status));
      function fuRow(a, highlighted) {
        return `
          <article class="list-row compact-row" style="cursor:default${highlighted ? ';border-left:3px solid var(--sage)' : ''}">
            <header>
              <div>
                <h4>${escapeHtml(a.title)}</h4>
                <p class="muted">${escapeHtml(a.team_name || 'No team')} | ${a.due_at ? 'Due ' + escapeHtml(formatDate(a.due_at, true)) : 'No due date'}</p>
              </div>
              <div style="display:flex;gap:4px;align-items:center">
                <span class="badge ${a.priority === 'high' ? 'danger' : a.priority === 'medium' ? 'warn' : ''}">${escapeHtml(a.priority || 'normal')}</span>
                <span class="badge">${escapeHtml(friendlyLabel(a.status))}</span>
              </div>
            </header>
          </article>`;
      }
      host.innerHTML = `
        <div class="list compact-list">
          ${openFu.map((a) => fuRow(a, true)).join('')}
          ${closedFu.map((a) => fuRow(a, false)).join('')}
          ${!openFu.length && !closedFu.length ? '<p class="muted">No follow-ups recorded.</p>' : ''}
        </div>`;
      return;
    }
  }

  function renderStudentProfilePage() {
    setPageTitle('Profile');
    const target = document.getElementById('studentProfilePage');
    if (!state.route.studentId) {
      target.innerHTML = '<section class="panel"><p class="muted">Choose a student from the directory.</p></section>';
      return;
    }
    target.innerHTML = '<section class="panel"><p class="muted">Loading profile...</p></section>';
    const profileGuard = getRenderGuard();
    callServer({ path: '/api/students/' + encodeURIComponent(state.route.studentId), method: 'get' }).then((data) => {
      if (!profileGuard()) { console.warn('profileGuard killed render, renderGeneration=', renderGeneration); return; }
      state.profileData = data;
      const student = data.profile;
      const openConcernCount = (data.concerns || []).filter((c) => ['open','triage','escalated'].includes(c.status)).length;
      const hasRecentMeetings = (data.meetings || []).length > 0;
      const hasOpenFollowUps = (data.actions || []).some((a) => ['open','in_progress'].includes(a.status));

      const actionButtons = [
        ['note', 'Add note', 'notes.create'],
        ['meeting', 'Log meeting', 'meetings.create'],
        ['concern', 'Open case', 'concerns.create'],
        ['closeconcern', 'Close case', 'concerns.close'],
        ['sendplan', 'SEND plan', 'send.manage'],
        ['followup', 'Add follow-up', 'actions.manage'],
      ].filter(([, , permission]) => hasPermission(permission));

      target.innerHTML = `
        <section class="profile-heading panel compact-panel">
          <div>
            <button class="text-button" id="backToStudents">Back to students</button>
            <h3>${escapeHtml(studentName(student))}</h3>
            <p class="muted">${escapeHtml(student.student_code)} | ${escapeHtml(student.year_group || 'No year')} | ${escapeHtml(student.tutor_group || student.form_group || 'No class')}</p>
          </div>
          <div class="badge-row">${(data.derivedRadar || []).filter((r) => ['active', 'monitoring'].includes(r.status)).map((r) => radarBadge({ teamKey: r.team_key, teamName: r.team_name })).join('') || '<span class="muted small">No active radar</span>'}</div>
        </section>
        <section class="profile-actions">
          ${actionButtons.map(([key, label]) => `<button class="button ${state.activeProfileAction === key ? '' : 'secondary'}" data-profile-action="${key}">${label}</button>`).join('')}
        </section>
        <div id="profileActionHost">${profileActionForm(state.activeProfileAction, data)}</div>
        <div class="profile-tabs-bar">
          <button data-profile-tab="overview" class="tab-btn${state.profileTab === 'overview' ? ' active' : ''}">Overview</button>
          <button data-profile-tab="concerns" class="tab-btn${state.profileTab === 'concerns' ? ' active' : ''}">
            Cases${openConcernCount > 0 ? ' <span class="tab-dot danger"></span>' : ''}
          </button>
          <button data-profile-tab="meetings" class="tab-btn${state.profileTab === 'meetings' ? ' active' : ''}">
            Meetings${hasRecentMeetings ? ' <span class="tab-dot"></span>' : ''}
          </button>
          <button data-profile-tab="followups" class="tab-btn${state.profileTab === 'followups' ? ' active' : ''}">
            Follow-ups${hasOpenFollowUps ? ' <span class="tab-dot warn"></span>' : ''}
          </button>
        </div>
        <div id="profileTabContent"></div>
      `;
      document.getElementById('backToStudents').onclick = () => updateRoute({ page: 'students', studentId: '' });
      Array.from(document.querySelectorAll('[data-profile-action]')).forEach((button) => {
        button.onclick = () => {
          state.activeProfileAction = state.activeProfileAction === button.dataset.profileAction ? '' : button.dataset.profileAction;
          Array.from(document.querySelectorAll('[data-profile-action]')).forEach((btn) => {
            btn.className = 'button ' + (state.activeProfileAction === btn.dataset.profileAction ? '' : 'secondary');
          });
          document.getElementById('profileActionHost').innerHTML = profileActionForm(state.activeProfileAction, state.profileData);
          bindProfileActionHandlers();
        };
      });
      Array.from(document.querySelectorAll('[data-profile-tab]')).forEach((btn) => {
        btn.onclick = () => {
          state.profileTab = btn.dataset.profileTab;
          Array.from(document.querySelectorAll('[data-profile-tab]')).forEach((b) => {
            b.className = 'tab-btn' + (state.profileTab === b.dataset.profileTab ? ' active' : '');
          });
          renderProfileTab(data);
        };
      });
      bindProfileActionHandlers();
      renderProfileTab(data);
    });
  }

  function renderMeetingsPage() {
    setPageTitle('Calendar');
    const target = document.getElementById('meetingsPage');
    target.innerHTML = `
      <section class="panel compact-panel">
        <div class="panel-header">
          <div>
            <p class="eyebrow">Follow-ups</p>
            <h3 class="section-title">Calendar</h3>
          </div>
          <div class="segmented">
            <button class="button ${state.route.view === 'calendar' ? '' : 'secondary'}" id="calendarView">Calendar</button>
            <button class="button ${state.route.view === 'list' ? '' : 'secondary'}" id="listView">List</button>
          </div>
        </div>
        <div class="toolbar">
          <input id="meetingSearchPage" class="search-input" value="${escapeHtml(state.route.q)}" placeholder="Search meetings or students">
          <input id="meetingFilterPage" class="filter-input" value="${escapeHtml(state.route.filter)}" placeholder="Filter calendar">
          <button class="button" id="applyMeetingFilter">Apply</button>
        </div>
        <div class="chip-row">${renderFilterChips(state.route.filter)}</div>
      </section>
      <section class="panel compact-panel" id="meetingViewHost">${skeletonRows(8)}</section>
    `;
    document.getElementById('calendarView').onclick = () => updateRoute({ page: 'meetings', view: 'calendar' });
    document.getElementById('listView').onclick = () => updateRoute({ page: 'meetings', view: 'list' });
    document.getElementById('applyMeetingFilter').onclick = () => updateRoute({ page: 'meetings', q: document.getElementById('meetingSearchPage').value, filter: document.getElementById('meetingFilterPage').value });

    const meetingGuard = getRenderGuard();
    callServer({ path: '/api/meetings', method: 'get', query: { q: state.route.q, filter: state.route.filter } }).then((data) => {
      if (!meetingGuard()) return;
      const meetings = data.meetings || [];
      const host = document.getElementById('meetingViewHost');
      if (!host) return;
      if (state.route.view === 'list') {
        host.innerHTML = `<div class="list compact-list">${meetings.map(renderMeetingRecord).join('') || '<p class="muted">No visible meetings.</p>'}</div>`;
        bindStudentLinks();
        return;
      }
      const grouped = {};
      meetings.forEach((meeting) => {
        const key = new Date(meeting.calendar_at || meeting.occurred_at).toISOString().slice(0, 10);
        grouped[key] = grouped[key] || [];
        grouped[key].push(meeting);
      });
      const days = Object.keys(grouped).sort().slice(0, 28);
      host.innerHTML = `
        <div class="calendar-grid">
          ${days.map((day) => `
            <article class="calendar-day">
              <h4>${escapeHtml(formatDate(day, true))}</h4>
              ${grouped[day].map((meeting) => `
                <button class="calendar-event" data-student-link="${meeting.student_id}">
                  <strong>${escapeHtml(meeting.title)}</strong>
                  <span>${escapeHtml(meeting.first_name)} ${escapeHtml(meeting.last_name)} | ${escapeHtml(friendlyLabel(meeting.item_status || meeting.interaction_type))}</span>
                </button>`).join('')}
            </article>`).join('') || '<p class="muted">No visible calendar items.</p>'}
        </div>`;
      bindStudentLinks();
    });
  }

          <span class="badge blue">${escapeHtml(friendlyLabel(item.item_type || item.interaction_type))}</span>
        </header>
        <p>${escapeHtml(item.summary)}</p>
        <p class="muted small">${escapeHtml(item.item_status || 'scheduled')} | ${escapeHtml(formatDate(item.calendar_at || item.occurred_at))}</p>
      </article>`;
  }

  function renderSettingsPage() {
    setPageTitle('Settings');
    const target = document.getElementById('settingsPage');
    const tab = state.route.settingsTab || 'users';
    const tabs = [['users', 'Users'], ['roles', 'Roles'], ['teams', 'Teams'], ['visibility', 'Team Sharing'], ['dropdowns', 'Dropdowns'], ['filters', 'Saved Filters'], ['students', 'Students'], ['audit', 'Audit Log']];

      target.innerHTML = `
        <section class="panel compact-panel"><div class="tabs" id="settingsTabs"></div></section>
        <div id="settingsBody">${skeletonRows(8)}</div>`;
      const tabsEl = target.querySelector('#settingsTabs');
      tabs.forEach(([key, label]) => {
        const btn = document.createElement('button');
        btn.dataset.settingsTab = key;
        btn.textContent = label;
        btn.onclick = () => { state.route.settingsTab = key; state.visibilityEditMode = false; state.visibilityPending = {}; renderSettingsPage(); };
        tabsEl.appendChild(btn);
      });
      target.dataset.built = '1';
    }

    // Update active tab button immediately — no wait.
    Array.from(target.querySelectorAll('[data-settings-tab]')).forEach((btn) => {
      btn.className = 'button ' + (btn.dataset.settingsTab === tab ? '' : 'secondary');
    });

    const guard = getRenderGuard();

    function paintTab(data) {
      if (!guard()) return;
      const bodyByTab = {
        users: renderUsersSettings(data),
        'user-roles': renderUserRolesSettings(data),
        roles: renderRolesSettings(data),
        teams: renderTeamsSettings(data),
        visibility: renderVisibilitySettings(data, state.visibilityEditMode, state.visibilityPending),
        dropdowns: renderDropdownSettings(data),
        filters: renderSavedFiltersSettings(data),
        students: renderStudentsManagementSettings(),
        audit: '<article class="panel compact-panel"><div id="auditLogTable">' + skeletonRows(8) + '</div></article>',
      };
      document.getElementById('settingsBody').outerHTML = '<div id="settingsBody">' + (bodyByTab[tab] || '') + '</div>';
      bindSettingsForms();
      if (tab === 'audit') loadAuditLog();
    }

    const cachedRef = getCached('settings:reference');
    if (cachedRef) {
      paintTab(cachedRef);
      // Only background-refresh when not in edit mode — concurrent direct Worker fetches
      // calls are unreliable and would race with any save the user triggers.
      if (!state.visibilityEditMode) {
        callServer({ path: '/api/settings/reference', method: 'get' }).then((data) => {
          setCached('settings:reference', data);
          paintTab(data);
        }).catch(() => {});
      }
    } else {
      document.getElementById('settingsBody').innerHTML = skeletonRows(8);
      callServer({ path: '/api/settings/reference', method: 'get' }).then((data) => {
        setCached('settings:reference', data);
        paintTab(data);
      });
    }
  }

  function loadStudentsManagement(filterOverride) {
    const codeFilter = (filterOverride && filterOverride.code !== undefined) ? filterOverride.code : (document.getElementById('smFilterCode') || {}).value || '';
    const nameFilter = (filterOverride && filterOverride.name !== undefined) ? filterOverride.name : (document.getElementById('smFilterName') || {}).value || '';
    const yearFilter = (filterOverride && filterOverride.year !== undefined) ? filterOverride.year : (document.getElementById('smFilterYear') || {}).value || '';
    const statusFilter = (filterOverride && filterOverride.status !== undefined) ? filterOverride.status : (document.getElementById('smFilterStatus') || {}).value || '';

    // Build a filter DSL expression from the settings filter controls
    const parts = [];
    if (nameFilter) parts.push('name~=' + nameFilter);
    if (yearFilter) parts.push('yearGroup==' + yearFilter);
    if (statusFilter) parts.push('status==' + statusFilter);
    const filterExpr = parts.join(';');
    const q = codeFilter;

    const wrap = document.getElementById('smStudentListWrap');
    if (wrap) wrap.classList.remove('hidden');
    const listEl = document.getElementById('smStudentList');
    if (listEl) listEl.innerHTML = skeletonRows(6);

    callServer({ path: '/api/students', method: 'get', query: { q, filter: filterExpr, limit: 200 } }).then((data) => {
      const students = data.students || [];
      const el = document.getElementById('smStudentList');
      if (!el) return;
      if (!students.length) { el.innerHTML = '<p class="muted small" style="padding:8px 0">No students found.</p>'; return; }

      el.innerHTML = `
        <div style="display:flex;gap:8px;align-items:center;margin-bottom:6px">
          <label class="check-control" style="font-size:13px"><input type="checkbox" id="smSelectAll"> Select all (${students.length})</label>
        </div>
        <div class="table-scroll">
          <table class="data-table dense-table">
            <thead><tr><th style="width:36px"></th><th>Student ID</th><th>Name</th><th>Year (calc.)</th><th>Date of Birth</th><th>Status</th></tr></thead>
            <tbody>${students.map((s) => `
              <tr>
                <td><input type="checkbox" class="sm-student-chk" data-id="${escapeHtml(s.id)}"></td>
                <td>${escapeHtml(s.student_code)}</td>
                <td>${escapeHtml(s.first_name)} ${escapeHtml(s.last_name)}</td>
                <td>${escapeHtml(s.year_group || '')}</td>
                <td>${escapeHtml(s.date_of_birth ? s.date_of_birth.slice(0, 10) : '')}</td>
                <td><span class="badge ${s.current_status === 'active' ? '' : 'secondary'}">${escapeHtml(s.current_status || 'active')}</span></td>
              </tr>`).join('')}
            </tbody>
          </table>
        </div>`;

      const selectAll = document.getElementById('smSelectAll');
      if (selectAll) selectAll.onchange = () => {
        document.querySelectorAll('.sm-student-chk').forEach((cb) => { cb.checked = selectAll.checked; });
        updateSmBulkBar();
      };
      document.querySelectorAll('.sm-student-chk').forEach((cb) => {
        cb.onchange = updateSmBulkBar;
      });
    }).catch((e) => {
      const el = document.getElementById('smStudentList');
      if (el) el.innerHTML = '<p class="muted small" style="color:#c0392b">Failed to load students: ' + escapeHtml(e.message) + '</p>';
    });
  }

  function updateSmBulkBar() {
    const checked = Array.from(document.querySelectorAll('.sm-student-chk:checked'));
    const bar = document.getElementById('smBulkBar');
    const count = document.getElementById('smBulkCount');
    if (!bar) return;
    if (checked.length > 0) {
      bar.classList.remove('hidden');
      if (count) count.textContent = checked.length + ' student' + (checked.length !== 1 ? 's' : '') + ' selected';
    } else {
      bar.classList.add('hidden');
    }
  }

  function smParseBulkAddText(raw) {
    return raw.split('\n').map((line) => line.trim()).filter(Boolean).map((line) => {
      const parts = line.split(',').map((p) => p.trim());
      return { studentCode: parts[0] || '', firstName: parts[1] || '', lastName: parts[2] || '', dateOfBirth: parts[3] || '' };
    });
  }

  function smParseCsv(text) {
    const lines = text.split(/\r?\n/).filter(Boolean);
    if (!lines.length) return [];
    const header = lines[0].split(',').map((h) => h.trim().toLowerCase().replace(/\s+/g, '_'));
    return lines.slice(1).map((line) => {
      const cols = line.split(',').map((c) => c.trim().replace(/^"|"$/g, ''));
      const obj = {};
      header.forEach((h, i) => { obj[h] = cols[i] || ''; });
      return {
        studentCode: obj.student_id || obj.student_code || '',
        firstName: obj.first_name || '',
        lastName: obj.last_name || '',
        dateOfBirth: obj.date_of_birth || obj.dob || '',
      };
    }).filter((r) => r.studentCode);
  }
